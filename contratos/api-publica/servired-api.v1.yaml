# API pública de SERVI-RED expuesta por el API Gateway.
# Es el ÚNICO contrato que consumen los portales web y las apps Android/iOS.
# Versionado en la ruta (/api/v1); cambios incompatibles => /api/v2 (RNF-DAT3).
# Estado: fase 4 (reportes completo y denuncias). Cada fase agrega sus operaciones.
openapi: 3.1.0
info:
  title: SERVI-RED · API pública
  version: 1.0.0-fase4
  description: |
    Plataforma de reporte ciudadano y monitoreo de servicios públicos domiciliarios.

    **Correlación (RNF-OBS1):** toda respuesta incluye `X-Correlation-Id`. El cliente
    puede enviarlo (UUID); si falta o es inválido, el gateway genera uno. Reenviar
    la misma solicitud con el mismo `X-Correlation-Id` es seguro: la creación es
    idempotente.

    **Errores:** formato `application/problem+json` (RFC 9457).

    **Autenticación (RNF-SEG1):** `Authorization: Bearer <tokenAcceso>`. El token
    es un JWT RS256 de 15 minutos emitido por `POST /api/v1/auth/login`; se renueva
    con `POST /api/v1/auth/refrescar` (el token de refresco es de un solo uso y dura
    14 días). Claims: `sub` (id de la cuenta), `rol` y, para operadores, `emp`.

    **Roles (RNF-SEG2):** CIUDADANO, OPERADOR, REGULADOR, ADMINISTRADOR. Cada
    operación indica en su descripción qué roles la pueden invocar.

    **Límite de abuso (RNF-SEG5):** `/api/v1/auth/**` y `/api/v1/denuncias/**`
    responden 429 con `Retry-After` al superar el límite por cliente.
  license:
    name: Uso académico · Pontificia Universidad Javeriana
servers:
  - url: http://localhost:8080
    description: Entorno local (Docker Compose)

tags:
  - name: autenticacion
    description: Registro, inicio, renovación y cierre de sesión
  - name: cuentas
    description: Cuenta propia y administración de cuentas (RF-11)
  - name: reportes
    description: Cortes, restablecimientos, evidencias y validación comunitaria (RF-1 a RF-4)
  - name: denuncias
    description: Denuncias anónimas de conexiones fraudulentas (RF-5)
  - name: salud
    description: Estado del gateway

paths:
  /readyz:
    get:
      tags: [salud]
      operationId: saludGateway
      summary: Estado del gateway (readiness)
      security: []
      responses:
        "200":
          description: El gateway está disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }

  /api/v1/reportes:
    get:
      tags: [reportes]
      operationId: listarMisReportes
      summary: Reportes del ciudadano, del más reciente al más antiguo (RF-2)
      description: Solo CIUDADANO. Las entradas de la lista no incluyen la historia.
      parameters:
        - { name: pagina, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: tamano, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Página de reportes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaReportes" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [reportes]
      operationId: crearReporte
      summary: Registrar un corte no programado (RF-1)
      description: |
        Registra el reporte y confirma su recepción (RF-2). El reporte queda
        persistido antes de responder; los demás procesos (atención,
        indicadores, auditoría) se enteran por eventos y su falla no impide
        el registro (RNF-DC2). La fotografía se adjunta después con
        `POST /api/v1/reportes/{idReporte}/evidencias`. Solo CIUDADANO.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoReporte" }
      responses:
        "201":
          description: Reporte recibido
          headers:
            Location:
              schema: { type: string }
              description: /api/v1/reportes/{idReporte}
            X-Correlation-Id: { $ref: "#/components/headers/IdCorrelacion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /api/v1/reportes/cercanos:
    get:
      tags: [reportes]
      operationId: buscarReportesCercanos
      summary: Eventos activos cercanos para validar (RF-4)
      description: |
        Solo CIUDADANO. Reportes no cerrados a máximo 1 km, excluyendo los propios.
        No incluye autor ni descripción (minimización de datos).
      parameters:
        - { name: latitud, in: query, required: true, schema: { type: number, minimum: -4.3, maximum: 13.5 } }
        - { name: longitud, in: query, required: true, schema: { type: number, minimum: -82, maximum: -66.8 } }
      responses:
        "200":
          description: Eventos ordenados por distancia
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReporteCercano" } }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/reportes/{idReporte}:
    get:
      tags: [reportes]
      operationId: consultarReporte
      summary: Consultar el estado y la historia de un reporte (RF-2)
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - name: idReporte
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reporte con su historia
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/IdCorrelacion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /api/v1/reportes/{idReporte}/restablecimiento:
    post:
      tags: [reportes]
      operationId: registrarRestablecimiento
      summary: Registrar el restablecimiento y calcular la duración (RF-3)
      description: |
        Solo el autor. `duracionMinutos = fechaRestablecimiento − inicioEstimado`.
        La fecha debe ser posterior al inicio y no futura. Una sola vez (409
        `YA_RESTABLECIDO`). Publica `restablecimiento.registrado`.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idReporte, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoRestablecimiento" }
      responses:
        "200":
          description: Reporte restablecido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/ReglaIncumplida" }

  /api/v1/reportes/{idReporte}/validaciones:
    post:
      tags: [reportes]
      operationId: validarReporte
      summary: Confirmar o controvertir un corte o restablecimiento cercano (RF-4)
      description: |
        Solo CIUDADANO distinto del autor, ubicado a máximo 1 km. Un voto por
        ciudadano y objeto: repetirlo responde 200 con el estado actual sin
        cambiarlo. Validado = 3 confirmaciones netas (ADR-08). Validar no cambia
        el estado del reporte. Motivos de 409: AUTOR, LEJOS, CERRADO,
        SIN_RESTABLECIMIENTO. Publica `validacion.registrada`.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idReporte, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaValidacion" }
      responses:
        "201":
          description: Voto registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Validacion" }
        "200":
          description: El ciudadano ya había votado; estado actual sin cambios
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Validacion" }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/ReglaIncumplida" }

  /api/v1/reportes/{idReporte}/evidencias:
    post:
      tags: [reportes]
      operationId: adjuntarEvidencia
      summary: Adjuntar una fotografía al reporte (RF-1)
      description: |
        Solo el autor. JPEG o PNG (tipo detectado por contenido), máximo 5 MB y
        40 megapíxeles, hasta 3 por reporte. La imagen se vuelve a codificar:
        se eliminan EXIF, GPS y demás metadatos (y la orientación EXIF; envíela
        ya orientada).
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idReporte, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto: { type: string, format: binary }
      responses:
        "201":
          description: Evidencia guardada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/ReglaIncumplida" }
        "413": { description: La fotografía supera 5 MB }
        "422": { $ref: "#/components/responses/EvidenciaInvalida" }

  /api/v1/reportes/{idReporte}/evidencias/{idEvidencia}:
    get:
      tags: [reportes]
      operationId: obtenerEvidencia
      summary: Descargar una fotografía del reporte
      description: Solo el autor. Se sirve con Cache-Control no-store y X-Content-Type-Options nosniff.
      parameters:
        - { name: idReporte, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: idEvidencia, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: La imagen
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  # ---------------------------------------------------------------- denuncias
  /api/v1/denuncias:
    post:
      tags: [denuncias]
      operationId: denunciarConexionFraudulenta
      summary: Denuncia anónima de una conexión fraudulenta (RF-5)
      description: |
        Pública y sin token (ADR-09): el gateway descarta Authorization y Cookie y
        genera un X-Correlation-Id aleatorio. No se guarda ningún identificador del
        denunciante (RNF-SEG4). La foto opcional se sanea igual que en los reportes.
        Límite: 5 por minuto por cliente (429). Publica `denuncia.recibida`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaDenuncia" }
          multipart/form-data:
            schema:
              type: object
              required: [denuncia]
              properties:
                denuncia: { $ref: "#/components/schemas/NuevaDenuncia" }
                foto: { type: string, format: binary }
            encoding:
              denuncia: { contentType: application/json }
      responses:
        "202":
          description: Recibida; queda pendiente de validación por Atención
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DenunciaRecibida" }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "413": { description: La fotografía supera 5 MB }
        "422": { $ref: "#/components/responses/EvidenciaInvalida" }
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }

  # ------------------------------------------------------------ autenticación
  /api/v1/auth/registro:
    post:
      tags: [autenticacion]
      operationId: registrarCiudadano
      summary: Registrar una cuenta de ciudadano (RF-11)
      description: Pública. Exige autorizar el tratamiento de datos personales (Ley 1581 de 2012).
      security: []
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoCiudadano" }
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cuenta" }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }

  /api/v1/auth/login:
    post:
      tags: [autenticacion]
      operationId: iniciarSesion
      summary: Iniciar sesión
      description: |
        Pública. Un correo inexistente, una clave incorrecta o una cuenta
        desactivada responden igual (401), para no revelar qué cuentas existen.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credenciales" }
      responses:
        "200":
          description: Sesión iniciada (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }

  /api/v1/auth/refrescar:
    post:
      tags: [autenticacion]
      operationId: renovarSesion
      summary: Renovar la sesión con el token de refresco
      description: |
        Pública. Rota el token: el anterior deja de servir. Presentar un token ya
        usado revoca todas las sesiones de la cuenta (posible robo) y responde 401.
        No reintente automáticamente con el mismo token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudRefresco" }
      responses:
        "200":
          description: Nuevo par de tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }

  /api/v1/auth/cerrar-sesion:
    post:
      tags: [autenticacion]
      operationId: cerrarSesion
      summary: Cerrar la sesión (revoca el token de refresco)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudRefresco" }
      responses:
        "204": { description: Sesión cerrada (también si el token no existía) }

  # ------------------------------------------------------------------ cuentas
  /api/v1/cuentas/yo:
    get:
      tags: [cuentas]
      operationId: consultarCuentaPropia
      summary: Consultar la cuenta propia
      description: Cualquier rol autenticado.
      responses:
        "200":
          description: La cuenta del usuario del token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cuenta" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    patch:
      tags: [cuentas]
      operationId: actualizarCuentaPropia
      summary: Editar el nombre o cambiar la clave
      description: Cambiar la clave exige la clave actual y cierra todas las sesiones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CambiosCuentaPropia" }
      responses:
        "200":
          description: Cuenta actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cuenta" }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    delete:
      tags: [cuentas]
      operationId: suprimirCuentaPropia
      summary: Suprimir la cuenta propia (derecho de supresión)
      description: |
        Anonimiza correo y nombre y revoca las sesiones. Los reportes se conservan
        asociados a un identificador seudónimo. Un administrador no puede usarla.
      responses:
        "204": { description: Cuenta suprimida }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/cuentas:
    post:
      tags: [cuentas]
      operationId: crearCuenta
      summary: Crear una cuenta de cualquier rol (RF-11)
      description: Solo ADMINISTRADOR. Un OPERADOR debe indicar su empresa prestadora.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaCuentaPersonal" }
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cuenta" }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }
    get:
      tags: [cuentas]
      operationId: listarCuentas
      summary: Listar cuentas
      description: Solo ADMINISTRADOR.
      parameters:
        - { name: rol, in: query, schema: { $ref: "#/components/schemas/Rol" } }
        - { name: pagina, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: tamano, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Página de cuentas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaCuentas" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/cuentas/{idCuenta}:
    parameters:
      - { name: idCuenta, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cuentas]
      operationId: consultarCuenta
      summary: Consultar una cuenta
      description: Solo ADMINISTRADOR.
      responses:
        "200":
          description: La cuenta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cuenta" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [cuentas]
      operationId: actualizarCuenta
      summary: Editar, activar o desactivar una cuenta
      description: |
        Solo ADMINISTRADOR. Desactivar revoca las sesiones; el token de acceso ya
        emitido sigue valiendo hasta su expiración (máximo 15 min). Un
        administrador no puede desactivarse a sí mismo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CambiosCuenta" }
      responses:
        "200":
          description: Cuenta actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cuenta" }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    delete:
      tags: [cuentas]
      operationId: eliminarCuenta
      summary: Eliminar (anonimizar) una cuenta
      description: Solo ADMINISTRADOR; no puede eliminar su propia cuenta.
      responses:
        "204": { description: Cuenta eliminada }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 emitido por Identidad (POST /api/v1/auth/login).

  parameters:
    IdCorrelacion:
      name: X-Correlation-Id
      in: header
      required: false
      description: UUID de la transacción. También es la clave de idempotencia.
      schema: { type: string, format: uuid }

  headers:
    IdCorrelacion:
      description: UUID de la transacción (el recibido o uno generado por el gateway).
      schema: { type: string, format: uuid }

  schemas:
    TipoServicio:
      type: string
      enum: [ENERGIA, GAS, ACUEDUCTO, ALCANTARILLADO, ASEO]
      description: |
        ENERGIA = energía eléctrica · GAS = gas natural o licuado ·
        ACUEDUCTO = agua potable · ALCANTARILLADO · ASEO = recolección de basuras y residuos

    Magnitud:
      type: string
      enum: [VIVIENDA, CUADRA, BARRIO, SECTOR]
      description: Magnitud del área afectada según el ciudadano

    EstadoReporte:
      type: string
      enum: [RECIBIDO, EN_ATENCION, RESTABLECIDO, CERRADO]

    Ubicacion:
      type: object
      required: [latitud, longitud]
      properties:
        latitud: { type: number, minimum: -4.3, maximum: 13.5, example: 4.6287 }
        longitud: { type: number, minimum: -82, maximum: -66.8, example: -74.0648 }

    NuevoReporte:
      type: object
      required: [tipoServicio, ubicacion, inicioEstimado, magnitud]
      additionalProperties: false
      properties:
        tipoServicio: { $ref: "#/components/schemas/TipoServicio" }
        ubicacion: { $ref: "#/components/schemas/Ubicacion" }
        inicioEstimado:
          type: string
          format: date-time
          description: |
            Hora estimada de inicio del corte, con zona horaria (RNF-DAT1): no puede ser
            futura (se toleran 5 minutos de diferencia de reloj) ni tener más de 30 días.
        magnitud: { $ref: "#/components/schemas/Magnitud" }
        descripcion: { type: string, maxLength: 1000 }

    EntradaHistoria:
      type: object
      required: [estado, fecha]
      properties:
        estado: { $ref: "#/components/schemas/EstadoReporte" }
        fecha: { type: string, format: date-time }
        detalle: { type: string }

    Reporte:
      type: object
      required: [idReporte, tipoServicio, ubicacion, codigoMunicipio, inicioEstimado,
                 magnitud, estado, fechaRegistro, historia]
      properties:
        idReporte: { type: string, format: uuid }
        tipoServicio: { $ref: "#/components/schemas/TipoServicio" }
        ubicacion: { $ref: "#/components/schemas/Ubicacion" }
        codigoMunicipio:
          type: string
          pattern: "^[0-9]{5}$"
          description: Código DIVIPOLA resuelto a partir de la ubicación
        nombreMunicipio: { type: string }
        inicioEstimado: { type: string, format: date-time }
        magnitud: { $ref: "#/components/schemas/Magnitud" }
        descripcion: { type: string }
        estado: { $ref: "#/components/schemas/EstadoReporte" }
        fechaRegistro: { type: string, format: date-time }
        fechaRestablecimiento: { type: string, format: date-time }
        duracionMinutos: { type: integer, minimum: 0, description: fechaRestablecimiento − inicioEstimado }
        validacion:
          type: object
          properties:
            corte: { $ref: "#/components/schemas/ConteoValidacion" }
            restablecimiento: { $ref: "#/components/schemas/ConteoValidacion" }
        evidencias:
          type: array
          items: { $ref: "#/components/schemas/Evidencia" }
        historia:
          type: array
          description: En orden de registro
          items: { $ref: "#/components/schemas/EntradaHistoria" }

    ConteoValidacion:
      type: object
      required: [confirmaciones, controversias, confirmacionesNetas]
      properties:
        confirmaciones: { type: integer }
        controversias: { type: integer }
        confirmacionesNetas: { type: integer }

    Evidencia:
      type: object
      required: [idEvidencia, tipoContenido, tamanoBytes, creadaEn, url]
      properties:
        idEvidencia: { type: string, format: uuid }
        tipoContenido: { type: string, enum: [image/jpeg, image/png] }
        tamanoBytes: { type: integer }
        creadaEn: { type: string, format: date-time }
        url: { type: string, description: Ruta de descarga en este API }

    PaginaReportes:
      type: object
      required: [elementos, total, pagina, tamano]
      properties:
        elementos: { type: array, items: { $ref: "#/components/schemas/Reporte" } }
        total: { type: integer }
        pagina: { type: integer }
        tamano: { type: integer }

    ReporteCercano:
      type: object
      required: [idReporte, tipoServicio, magnitud, estado, inicioEstimado, ubicacion, distanciaMetros]
      properties:
        idReporte: { type: string, format: uuid }
        tipoServicio: { $ref: "#/components/schemas/TipoServicio" }
        magnitud: { $ref: "#/components/schemas/Magnitud" }
        estado: { $ref: "#/components/schemas/EstadoReporte" }
        inicioEstimado: { type: string, format: date-time }
        ubicacion: { $ref: "#/components/schemas/Ubicacion" }
        distanciaMetros: { type: integer }
        validacionCorte: { $ref: "#/components/schemas/ConteoValidacion" }
        validacionRestablecimiento: { $ref: "#/components/schemas/ConteoValidacion" }

    NuevoRestablecimiento:
      type: object
      required: [fechaRestablecimiento]
      additionalProperties: false
      properties:
        fechaRestablecimiento: { type: string, format: date-time }
        comentario: { type: string, maxLength: 500 }

    NuevaValidacion:
      type: object
      required: [objeto, sentido, ubicacion]
      additionalProperties: false
      properties:
        objeto: { type: string, enum: [CORTE, RESTABLECIMIENTO] }
        sentido: { type: string, enum: [CONFIRMA, CONTROVIERTE] }
        ubicacion:
          allOf: [{ $ref: "#/components/schemas/Ubicacion" }]
          description: Ubicación actual del validador; solo se usa para comprobar la distancia y no se guarda

    Validacion:
      type: object
      required: [idReporte, objeto, confirmaciones, controversias, confirmacionesNetas, validado]
      properties:
        idReporte: { type: string, format: uuid }
        objeto: { type: string, enum: [CORTE, RESTABLECIMIENTO] }
        confirmaciones: { type: integer }
        controversias: { type: integer }
        confirmacionesNetas: { type: integer }
        validado: { type: boolean, description: true con 3 o más confirmaciones netas }

    NuevaDenuncia:
      type: object
      required: [tipoServicio, ubicacion, descripcion]
      additionalProperties: false
      properties:
        tipoServicio: { $ref: "#/components/schemas/TipoServicio" }
        ubicacion: { $ref: "#/components/schemas/Ubicacion" }
        descripcion: { type: string, minLength: 10, maxLength: 2000 }

    DenunciaRecibida:
      type: object
      required: [idDenuncia, estado, fechaRecepcion, tieneEvidencia]
      properties:
        idDenuncia: { type: string, format: uuid }
        estado: { type: string, enum: [PENDIENTE_VALIDACION] }
        fechaRecepcion: { type: string, format: date-time }
        tieneEvidencia: { type: boolean }
        mensaje: { type: string }

    Rol:
      type: string
      enum: [CIUDADANO, OPERADOR, REGULADOR, ADMINISTRADOR]

    Clave:
      type: string
      minLength: 10
      maxLength: 64
      description: Entre 10 y 64 caracteres (máximo 72 bytes) y distinta del correo.

    NuevoCiudadano:
      type: object
      required: [correo, clave, aceptaTratamientoDatos]
      additionalProperties: false
      properties:
        correo: { type: string, format: email, maxLength: 254 }
        clave: { $ref: "#/components/schemas/Clave" }
        nombre: { type: string, maxLength: 120 }
        aceptaTratamientoDatos:
          type: boolean
          const: true
          description: Autorización de tratamiento de datos personales (Ley 1581 de 2012)

    Credenciales:
      type: object
      required: [correo, clave]
      additionalProperties: false
      properties:
        correo: { type: string }
        clave: { type: string }

    SolicitudRefresco:
      type: object
      required: [tokenRefresco]
      additionalProperties: false
      properties:
        tokenRefresco: { type: string }

    Sesion:
      type: object
      required: [tokenAcceso, tipoToken, expiraEn, tokenRefresco, cuenta]
      properties:
        tokenAcceso: { type: string, description: JWT para la cabecera Authorization }
        tipoToken: { type: string, const: Bearer }
        expiraEn: { type: integer, description: Segundos de vigencia del token de acceso }
        tokenRefresco: { type: string, description: Opaco, de un solo uso; guárdelo de forma segura }
        cuenta:
          type: object
          required: [idCuenta, rol]
          properties:
            idCuenta: { type: string, format: uuid }
            rol: { $ref: "#/components/schemas/Rol" }
            nombre: { type: string }
            idEmpresa: { type: string, format: uuid }

    Cuenta:
      type: object
      required: [idCuenta, correo, rol, activa, creadaEn]
      properties:
        idCuenta: { type: string, format: uuid }
        correo: { type: string, format: email }
        rol: { $ref: "#/components/schemas/Rol" }
        idEmpresa: { type: string, format: uuid, description: Solo para OPERADOR }
        nombre: { type: string }
        activa: { type: boolean }
        creadaEn: { type: string, format: date-time }

    PaginaCuentas:
      type: object
      required: [elementos, total, pagina, tamano]
      properties:
        elementos: { type: array, items: { $ref: "#/components/schemas/Cuenta" } }
        total: { type: integer }
        pagina: { type: integer }
        tamano: { type: integer }

    NuevaCuentaPersonal:
      type: object
      required: [correo, clave, rol]
      additionalProperties: false
      properties:
        correo: { type: string, format: email, maxLength: 254 }
        clave: { $ref: "#/components/schemas/Clave" }
        nombre: { type: string, maxLength: 120 }
        rol: { $ref: "#/components/schemas/Rol" }
        idEmpresa: { type: string, format: uuid, description: Obligatoria si rol = OPERADOR }

    CambiosCuenta:
      type: object
      additionalProperties: false
      properties:
        nombre: { type: string, maxLength: 120 }
        activa: { type: boolean }
        idEmpresa: { type: string, format: uuid }

    CambiosCuentaPropia:
      type: object
      additionalProperties: false
      properties:
        nombre: { type: string, maxLength: 120 }
        claveActual: { type: string }
        claveNueva: { $ref: "#/components/schemas/Clave" }

    Problema:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string, format: uuid }
        motivo: { type: string, description: Código estable de la regla incumplida (409) }
        errores:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }

  responses:
    SolicitudInvalida:
      description: Datos inválidos (RNF-DAT1)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    NoAutenticado:
      description: Falta un token válido (RNF-SEG1)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    ReglaIncumplida:
      description: Una regla de negocio impide la operación; ver `motivo`
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    EvidenciaInvalida:
      description: El archivo no es una fotografía JPEG/PNG aceptable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    Prohibido:
      description: El rol del token no tiene permiso para esta operación (RNF-SEG2)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    Conflicto:
      description: El recurso ya existe (p. ej. correo registrado)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    NoEncontrado:
      description: El recurso no existe o no es visible para el usuario
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    NoDisponible:
      description: |
        El registro no pudo completarse (Persistencia no disponible). Es seguro
        reintentar con el mismo X-Correlation-Id.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    DemasiadasSolicitudes:
      description: Límite de uso excedido (RNF-SEG5)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }

security:
  - jwt: []
