# Contrato interno del servicio de Persistencia (ADR-02).
# Solo accesible en la red interna; el gateway NO lo enruta.
#
# Reglas:
#  - Operaciones de NEGOCIO (guardarReporte, actualizarEstadoCaso, ...),
#    nunca un CRUD genérico de tablas. Ningún cliente conoce el esquema físico.
#  - Cada servicio se autentica con su propia clave (X-Clave-Servicio) y solo
#    puede invocar las operaciones de su dominio (mínimo privilegio).
#  - X-Correlation-Id es obligatorio y es la clave de idempotencia junto con
#    la operación: un reintento devuelve la respuesta original sin reescribir.
#  - Las operaciones que generan un evento reciben el evento ya construido por
#    el servicio dueño; Persistencia lo guarda en el outbox en la MISMA
#    transacción y lo publica después (decisión B).
# Estado: fase 7 (todos los dominios, incluida la auditoría).
openapi: 3.1.0
info:
  title: SERVI-RED · Persistencia (API interna)
  version: 1.0.0-fase7
servers:
  - url: http://persistencia:8080
    description: Red interna de Docker Compose

security:
  - claveServicio: []

paths:
  /interno/v1/reportes/guardar:
    post:
      operationId: guardarReporte
      summary: Guardar un reporte nuevo y su evento reporte.creado
      description: |
        Invocable solo por `reportes`. En una transacción: inserta el reporte,
        su primera entrada de historia y el evento en el outbox.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reporte, evento]
              properties:
                reporte: { $ref: "#/components/schemas/ReporteAGuardar" }
                evento: { $ref: "#/components/schemas/EventoSaliente" }
      responses:
        "201":
          description: Reporte guardado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReporteGuardado" }
        "200":
          description: Reintento de un X-Correlation-Id ya procesado; devuelve el reporte original
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReporteGuardado" }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409":
          description: |
            Viola una regla de integridad (p. ej. municipio inexistente), el evento no
            pertenece a la operación o su correlationId no coincide con X-Correlation-Id

  /interno/v1/reportes/{idReporte}:
    get:
      operationId: consultarReporte
      summary: Consultar un reporte con su historia
      description: Invocable solo por `reportes`.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - name: idReporte
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reporte encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReporteGuardado" }
        "404":
          description: No existe

  /interno/v1/reportes:
    get:
      operationId: listarReportesDeCiudadano
      description: Solo `reportes`. Las entradas no incluyen historia ni evidencias.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idCiudadano, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: pagina, in: query, schema: { type: integer } }
        - { name: tamano, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: Página
          content:
            application/json:
              schema:
                type: object
                properties:
                  elementos: { type: array, items: { $ref: "#/components/schemas/ReporteGuardado" } }
                  total: { type: integer }
                  pagina: { type: integer }
                  tamano: { type: integer }

  /interno/v1/reportes/cercanos:
    get:
      operationId: buscarReportesCercanos
      description: Solo `reportes`. Haversine; excluye cerrados y los del ciudadano indicado. Sin datos del autor.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: latitud, in: query, required: true, schema: { type: number } }
        - { name: longitud, in: query, required: true, schema: { type: number } }
        - { name: radioMetros, in: query, schema: { type: integer, maximum: 5000, default: 1000 } }
        - { name: excluirCiudadano, in: query, schema: { type: string, format: uuid } }
        - { name: limite, in: query, schema: { type: integer, maximum: 100, default: 50 } }
      responses:
        "200": { description: Lista ordenada por distancia }

  /interno/v1/reportes/{idReporte}/restablecimiento:
    post:
      operationId: registrarRestablecimiento
      description: |
        Solo `reportes`. En una transacción: estado RESTABLECIDO (solo desde RECIBIDO
        o EN_ATENCION), historia y `restablecimiento.registrado` en el outbox.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idReporte, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fechaRestablecimiento, duracionMinutos, evento]
              properties:
                fechaRestablecimiento: { type: string, format: date-time }
                duracionMinutos: { type: integer, minimum: 0 }
                comentario: { type: string, maxLength: 500 }
                evento: { $ref: "#/components/schemas/EventoSaliente" }
      responses:
        "200": { description: Reporte actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/ReporteGuardado" } } } }
        "404": { description: No existe }
        "409": { $ref: "#/components/responses/Conflicto" }

  /interno/v1/reportes/{idReporte}/validaciones:
    post:
      operationId: registrarValidacion
      description: |
        Solo `reportes`. Concurrencia optimista: `versionEsperada` debe coincidir con
        `versionValidaciones` (409 `VERSION`). Un voto por ciudadano y objeto
        (409 `YA_VOTO`). No guarda la ubicación del validador.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idReporte, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objeto, sentido, idCiudadano, fecha, versionEsperada, evento]
              properties:
                objeto: { type: string, enum: [CORTE, RESTABLECIMIENTO] }
                sentido: { type: string, enum: [CONFIRMA, CONTROVIERTE] }
                idCiudadano: { type: string, format: uuid }
                fecha: { type: string, format: date-time }
                versionEsperada: { type: integer, minimum: 0 }
                cuenta:
                  type: boolean
                  default: true
                  description: "false: el voto se guarda pero no suma a los conteos (cuenta demasiado nueva, ADR-22)"
                evento: { $ref: "#/components/schemas/EventoSaliente" }
      responses:
        "201": { description: Voto guardado, content: { application/json: { schema: { $ref: "#/components/schemas/ReporteGuardado" } } } }
        "404": { description: No existe }
        "409": { $ref: "#/components/responses/Conflicto" }

  /interno/v1/reportes/{idReporte}/evidencias:
    post:
      operationId: guardarEvidencia
      description: |
        Solo `reportes`, con la imagen YA saneada en el cuerpo. Sube el objeto al
        almacén S3 y guarda la referencia (si la base falla, se borra el objeto).
        Máximo 3 por reporte (409 `LIMITE`).
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idReporte, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Id-Evidencia, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        "201": { description: Guardada, content: { application/json: { schema: { $ref: "#/components/schemas/ReporteGuardado" } } } }
        "404": { description: No existe }
        "409": { $ref: "#/components/responses/Conflicto" }

  /interno/v1/reportes/{idReporte}/evidencias/{idEvidencia}:
    get:
      operationId: obtenerEvidencia
      description: Solo `reportes`. 404 si la evidencia no pertenece a ese reporte.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idReporte, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: idEvidencia, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Bytes de la imagen
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404": { description: No existe }

  /interno/v1/denuncias:
    post:
      operationId: guardarDenuncia
      description: |
        Solo `reportes`. Denuncia anónima, foto opcional (ya saneada) y
        `denuncia.recibida` en una sola transacción. Sin identificadores del denunciante.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [solicitud]
              properties:
                solicitud:
                  type: object
                  description: JSON con `denuncia` (idDenuncia, tipoServicio, latitud, longitud, codigoMunicipio, descripcion, fechaRecepcion) y `evento`
                foto: { type: string, format: binary }
      responses:
        "201":
          description: Guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  idDenuncia: { type: string, format: uuid }
                  tipoServicio: { type: string }
                  codigoMunicipio: { type: string }
                  estado: { type: string, enum: [PENDIENTE_VALIDACION, VALIDADA, DESCARTADA] }
                  fechaRecepcion: { type: string, format: date-time }
                  tieneEvidencia: { type: boolean }

  /interno/v1/casos/abrir:
    post:
      operationId: abrirCaso
      summary: Abrir el caso de atención de un reporte
      description: |
        Invocable solo por `atencion`, al consumir reporte.creado. Idempotente por
        X-Correlation-Id (el del evento) y porque hay a lo sumo un caso por
        reporte: si ya existe, devuelve el caso original con 200.

        `eventos` (opcional): el caso.actualizado de la apertura (estado RECIBIDO, sin
        estadoAnterior). Se guarda en el outbox en la misma transacción y solo si el caso
        se insertó; una redelivery no lo vuelve a publicar.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CasoAAbrir"
                - type: object
                  properties:
                    eventos: { type: array, items: { $ref: "#/components/schemas/EventoSaliente" } }
      responses:
        "201":
          description: Caso abierto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CasoGuardado" }
        "200":
          description: El caso ya existía
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CasoGuardado" }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409":
          description: Municipio inexistente

  # ---------------------------------------------- identidad (solo `identidad`)
  /interno/v1/cuentas/registrar:
    post:
      operationId: registrarCuenta
      summary: Guardar una cuenta nueva (guardarUsuario)
      description: Idempotente por X-Correlation-Id. 409 si el correo ya existe o la empresa no existe.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuentaAGuardar" }
      responses:
        "201": { description: Creada, content: { application/json: { schema: { $ref: "#/components/schemas/CuentaGuardada" } } } }
        "200": { description: Reintento ya procesado, content: { application/json: { schema: { $ref: "#/components/schemas/CuentaGuardada" } } } }
        "409": { description: Correo ya registrado o viola una regla de integridad }

  /interno/v1/cuentas/credenciales:
    post:
      operationId: buscarCredenciales
      summary: Credenciales para verificar un inicio de sesión
      description: El correo va en el cuerpo (nunca en la URL). Única operación que devuelve el hash de la clave.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [correo], properties: { correo: { type: string } } }
      responses:
        "200":
          description: Credenciales
          content:
            application/json:
              schema:
                type: object
                required: [idCuenta, hashClave, rol, activa]
                properties:
                  idCuenta: { type: string, format: uuid }
                  hashClave: { type: string }
                  rol: { type: string }
                  idEmpresa: { type: string, format: uuid }
                  nombre: { type: string }
                  activa: { type: boolean }
                  creadaEn: { type: string, format: date-time, description: "Va en el JWT (claim creada): ADR-22" }
        "404": { description: No existe (o fue eliminada) }

  /interno/v1/cuentas:
    get:
      operationId: listarCuentas
      description: Cuentas vigentes, las más recientes primero.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: rol, in: query, schema: { type: string } }
        - { name: correo, in: query, description: "Fragmento del correo (ILIKE literal)", schema: { type: string, maxLength: 254 } }
        - { name: pagina, in: query, schema: { type: integer } }
        - { name: tamano, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: Página
          content:
            application/json:
              schema:
                type: object
                properties:
                  elementos: { type: array, items: { $ref: "#/components/schemas/CuentaGuardada" } }
                  total: { type: integer }
                  pagina: { type: integer }
                  tamano: { type: integer }

  /interno/v1/cuentas/{idCuenta}:
    get:
      operationId: consultarCuenta
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idCuenta, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Cuenta, content: { application/json: { schema: { $ref: "#/components/schemas/CuentaGuardada" } } } }
        "404": { description: No existe }

  /interno/v1/cuentas/{idCuenta}/actualizar:
    post:
      operationId: actualizarCuenta
      description: Cambios parciales. Desactivar o cambiar el hash de la clave revoca todas las sesiones.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idCuenta, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string }
                activa: { type: boolean }
                idEmpresa: { type: string, format: uuid }
                hashClave: { type: string }
      responses:
        "200": { description: Actualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CuentaGuardada" } } } }
        "404": { description: No existe }

  /interno/v1/cuentas/{idCuenta}/eliminar:
    post:
      operationId: eliminarCuenta
      description: Anonimiza correo y nombre, invalida la clave y revoca las sesiones.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idCuenta, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Eliminada }
        "404": { description: No existe }

  /interno/v1/sesiones/abrir:
    post:
      operationId: abrirSesion
      description: Solo se guarda el SHA-256 (hex) del token de refresco.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idSesion, idCuenta, hashRefresco, expiraEn]
              properties:
                idSesion: { type: string, format: uuid }
                idCuenta: { type: string, format: uuid }
                hashRefresco: { type: string, pattern: "^[0-9a-f]{64}$" }
                expiraEn: { type: string, format: date-time }
                jtiAcceso: { type: string, format: uuid, description: "jti del token de acceso que se emite con esta sesión (ADR-26)" }
                accesoExpiraEn: { type: string, format: date-time, description: Expiración de ese token de acceso }
      responses:
        "201": { description: Sesión abierta }

  /interno/v1/sesiones/rotar:
    post:
      operationId: rotarSesion
      description: |
        Revoca la sesión actual y abre la nueva en una transacción. Si la sesión
        ya estaba revocada (reutilización) revoca todas las de la cuenta.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hashRefrescoActual, idSesionNueva, hashRefrescoNuevo, expiraEn]
              properties:
                hashRefrescoActual: { type: string, pattern: "^[0-9a-f]{64}$" }
                idSesionNueva: { type: string, format: uuid }
                hashRefrescoNuevo: { type: string, pattern: "^[0-9a-f]{64}$" }
                expiraEn: { type: string, format: date-time }
                jtiAcceso: { type: string, format: uuid, description: "jti del token de acceso de la sesión nueva (ADR-26)" }
                accesoExpiraEn: { type: string, format: date-time }
      responses:
        "200":
          description: Rotada
          content:
            application/json:
              schema: { type: object, properties: { cuenta: { $ref: "#/components/schemas/CuentaGuardada" } } }
        "409":
          description: Sesión inválida
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  motivo: { type: string, enum: [INEXISTENTE, EXPIRADA, CUENTA_INACTIVA, REUTILIZADA] }

  /interno/v1/sesiones/accesos-revocados:
    get:
      operationId: listarAccesosRevocados
      description: |
        Tokens de acceso revocados que aún no expiran (ADR-26), para la lista de revocación del
        gateway, que Identidad le entrega. Un acceso se revoca cuando se revocan las sesiones de
        la cuenta (desactivarla, suprimirla, cambiar la clave, reutilizar un refresco) o al cerrar
        sesión (esa sesión y las que reemplazó). Una rotación normal no revoca el acceso anterior.
        Solo `identidad`.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - name: desde
          in: query
          required: false
          description: Solo los revocados desde este momento (sincronización incremental)
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [jti, expiraEn, revocadoEn]
                  properties:
                    jti: { type: string, format: uuid }
                    expiraEn: { type: string, format: date-time }
                    revocadoEn: { type: string, format: date-time }

  /interno/v1/sesiones/cerrar:
    post:
      operationId: cerrarSesion
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [hashRefresco], properties: { hashRefresco: { type: string } } }
      description: Revoca la sesión y los tokens de acceso aún vigentes de ella y de las sesiones que reemplazó (ADR-26).
      responses:
        "204": { description: Cerrada (idempotente) }

  # ----------------------------------------------- atención (solo `atencion`)
  /interno/v1/casos:
    get:
      operationId: listarCasos
      description: "Bandeja. orden=PRIORIDAD (por omisión): CRITICA primero y, a igual prioridad, lo más antiguo; RECIENTES o ANTIGUOS: por fecha de apertura. Otro valor: 400."
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: estado, in: query, schema: { type: string } }
        - { name: tipoServicio, in: query, schema: { type: string } }
        - { name: codigoMunicipio, in: query, schema: { type: string } }
        - { name: codigoDepartamento, in: query, schema: { type: string }, description: Los dos primeros dígitos DIVIPOLA del municipio }
        - { name: prioridad, in: query, schema: { type: string } }
        - { name: idEmpresa, in: query, schema: { type: string, format: uuid } }
        - { name: sinEmpresa, in: query, schema: { type: boolean } }
        - { name: asignadoA, in: query, schema: { type: string, format: uuid } }
        - { name: idReporte, in: query, schema: { type: string, format: uuid } }
        - { name: orden, in: query, schema: { type: string, enum: [PRIORIDAD, RECIENTES, ANTIGUOS], default: PRIORIDAD } }
        - { name: pagina, in: query, schema: { type: integer } }
        - { name: tamano, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200": { description: "Página {elementos, total, pagina, tamano}" }

  /interno/v1/casos/{idCaso}:
    get:
      operationId: consultarCaso
      description: Caso con historia y las evidencias del reporte.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idCaso, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Caso }
        "404": { description: No existe }

  /interno/v1/casos/{idCaso}/actualizar:
    post:
      operationId: actualizarCaso
      description: |
        Cambios parciales con concurrencia optimista (`versionEsperada`, 409 VERSION),
        entrada de historia y eventos `caso.actualizado`/`caso.cerrado` al outbox, en
        una transacción. Idempotente por X-Correlation-Id.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idCaso, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionEsperada, fecha]
              properties:
                versionEsperada: { type: integer }
                estado: { type: string, enum: [RECIBIDO, EN_ATENCION, RESUELTO, CERRADO] }
                prioridad: { type: string, enum: [BAJA, MEDIA, ALTA, CRITICA] }
                prioridadManual: { type: boolean }
                asignadoA: { type: string, format: uuid }
                idEmpresa: { type: string, format: uuid }
                corteValidado: { type: boolean }
                resolucion: { type: string }
                resueltoEn: { type: string, format: date-time }
                cerradoEn: { type: string, format: date-time }
                detalleHistoria: { type: string }
                autor: { type: string, format: uuid }
                fecha: { type: string, format: date-time }
                eventos: { type: array, items: { $ref: "#/components/schemas/EventoSaliente" } }
      responses:
        "200": { description: Caso actualizado }
        "404": { description: No existe }
        "409": { $ref: "#/components/responses/Conflicto" }

  /interno/v1/casos/{idCaso}/evidencias/{idEvidencia}:
    get:
      operationId: obtenerEvidenciaDeCaso
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idCaso, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: idEvidencia, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Bytes de la imagen }
        "404": { description: No existe }

  /interno/v1/catalogo/cobertura:
    get:
      operationId: buscarCobertura
      description: |
        Solo `atencion`. Zona de servicio y su única empresa dueña (ADR-35). Busca por el punto
        (latitud y longitud) si lo hay; si no, por la ubicación guardada de la denuncia
        (idDenuncia: el evento no la trae); si no, la cabecera del municipio. Una localidad o
        comuna sin dueño propio hereda el de su cabecera o resto rural.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: tipoServicio, in: query, required: true, schema: { type: string } }
        - { name: latitud, in: query, schema: { type: number } }
        - { name: longitud, in: query, schema: { type: number } }
        - { name: idDenuncia, in: query, schema: { type: string, format: uuid } }
        - { name: codigoMunicipio, in: query, schema: { type: string } }
      responses:
        "200": { description: "{idZona, nombreZona, empresa: {idEmpresa, nombre} | null}" }
        "400": { description: Sin punto, denuncia ni municipio }
        "404": { description: No se pudo ubicar la zona }

  /interno/v1/catalogo/empresas:
    get:
      operationId: listarEmpresas
      description: |
        Solo `atencion`. Empresas prestadoras reales, por nombre, con los servicios que prestan. Con
        filtros, solo las dueñas de al menos una zona con ese servicio, en ese departamento o municipio.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: tipoServicio, in: query, schema: { type: string } }
        - { name: codigoDepartamento, in: query, schema: { type: string } }
        - { name: codigoMunicipio, in: query, schema: { type: string } }
      responses:
        "200": { description: "[{idEmpresa, nit, nombre, servicios[]}]" }

  /interno/v1/operadores/{idCuenta}:
    get:
      operationId: verificarOperador
      description: Solo responde si la cuenta es un operador activo de la empresa; no expone ningún dato de la cuenta.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idCuenta, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: idEmpresa, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{operadorDeLaEmpresa: boolean}" }

  /interno/v1/moderaciones/abrir:
    post:
      operationId: abrirModeracion
      description: Idempotente por idDenuncia.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idDenuncia, recibidaEn]
              properties:
                idDenuncia: { type: string, format: uuid }
                idEmpresa: { type: string, format: uuid }
                recibidaEn: { type: string, format: date-time }
      responses:
        "200": { description: Moderación (con descripción, ubicación y evidencias de la denuncia) }

  /interno/v1/moderaciones:
    get:
      operationId: listarModeraciones
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: estado, in: query, schema: { type: string } }
        - { name: idEmpresa, in: query, schema: { type: string, format: uuid } }
        - { name: pagina, in: query, schema: { type: integer } }
        - { name: tamano, in: query, schema: { type: integer } }
      responses:
        "200": { description: Página }

  /interno/v1/moderaciones/{idDenuncia}:
    get:
      operationId: consultarModeracion
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idDenuncia, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Moderación }
        "404": { description: No existe }

  /interno/v1/moderaciones/{idDenuncia}/decidir:
    post:
      operationId: decidirModeracion
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idDenuncia, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionEsperada, estado, nota, moderadaPor, fecha]
              properties:
                versionEsperada: { type: integer }
                estado: { type: string, enum: [VALIDADA, DESCARTADA] }
                nota: { type: string }
                moderadaPor: { type: string, format: uuid }
                fecha: { type: string, format: date-time }
      responses:
        "200": { description: Moderada }
        "409": { $ref: "#/components/responses/Conflicto" }

  /interno/v1/denuncias/{idDenuncia}/evidencias/{idEvidencia}:
    get:
      operationId: obtenerEvidenciaDenuncia
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idDenuncia, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: idEvidencia, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Bytes de la imagen }
        "404": { description: No existe }

  # ------------------------------------------- estado por caso (solo `reportes`)
  /interno/v1/reportes/{idReporte}/estado-por-caso:
    post:
      operationId: aplicarEstadoDeCaso
      description: |
        Refleja un evento de caso en el estado del reporte (ADR-07). Idempotente por
        `idEvento`; solo cambia si el estado actual está en `desde` (nunca retrocede).
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idReporte, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, estadoNuevo, desde, detalle, fecha]
              properties:
                idEvento: { type: string, format: uuid }
                estadoNuevo: { type: string, enum: [EN_ATENCION, RESTABLECIDO, CERRADO] }
                desde: { type: array, items: { type: string, enum: [RECIBIDO, EN_ATENCION, RESTABLECIDO] } }
                detalle: { type: string, maxLength: 500 }
                fecha: { type: string, format: date-time }
      responses:
        "200": { description: Reporte (cambiado o no) }
        "404": { description: No existe }

  # --------------------------------------- indicadores (solo `indicadores`)
  /interno/v1/indicadores/vista:
    post:
      operationId: actualizarVistaReporte
      description: |
        Upsert de la fila del reporte con lo que aporta un evento (null = no lo trae).
        Datos de creación y restablecimiento se completan una vez; validación y caso
        solo si `fechaEvento` es más reciente. Idempotente.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idReporte, fechaEvento]
              properties:
                idReporte: { type: string, format: uuid }
                fechaEvento: { type: string, format: date-time }
                tipoServicio: { type: string }
                codigoMunicipio: { type: string }
                latitud: { type: number }
                longitud: { type: number }
                magnitud: { type: string }
                inicioEstimado: { type: string, format: date-time }
                fechaRegistro: { type: string, format: date-time }
                fechaRestablecimiento: { type: string, format: date-time }
                duracionMinutos: { type: integer }
                validado: { type: boolean }
                confirmacionesNetas: { type: integer }
                estadoCaso: { type: string }
                prioridad: { type: string }
                idEmpresa: { type: string, format: uuid }
                resueltoEn: { type: string, format: date-time }
                cerradoEn: { type: string, format: date-time }
      responses:
        "204": { description: Aplicado }

  /interno/v1/indicadores/agregados:
    post:
      operationId: calcularAgregados
      description: |
        Conteos y estadísticas (mediana y p90 de duración) por la agrupación pedida.
        Sin anonimizar: la supresión la aplica Indicadores. Periodo máximo 400 días (409).
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filtro, agrupacion]
              properties:
                filtro: { $ref: "#/components/schemas/FiltroVista" }
                agrupacion: { type: string, enum: [NINGUNA, SERVICIO, DEPARTAMENTO, MUNICIPIO, MUNICIPIO_SERVICIO_MES, CELDA] }
                celdaGrados: { type: number, minimum: 0.001, maximum: 1, description: "En CELDA: lado en las cabeceras municipales (por defecto 0,01°)" }
                celdaRuralGrados:
                  type: number
                  minimum: 0.001
                  maximum: 1
                  description: |
                    En CELDA: lado fuera de las cabeceras municipales (ADR-28); no puede ser menor que
                    celdaGrados. Por defecto, el mayor entre celdaGrados y 0,05°. Un reporte sin
                    clasificar se trata como rural.
      responses:
        "200":
          description: |
            Lista de agregados. En CELDA, cada uno trae enCabecera (true en una cabecera
            municipal, false fuera); en las demás agrupaciones es null.
        "409": { description: Periodo o celda inválidos }

  /interno/v1/indicadores/hechos:
    post:
      operationId: listarHechos
      description: Filas de la vista (sin ciudadano) paginadas; máximo 10.000 por página.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filtro]
              properties:
                filtro: { $ref: "#/components/schemas/FiltroVista" }
                desde: { type: integer }
                limite: { type: integer, maximum: 10000 }
      responses:
        "200": { description: "{elementos, hayMas}" }

  /interno/v1/indicadores/reconstruccion:
    post:
      operationId: reconstruirVistaIndicadores
      description: |
        Solo `indicadores` (R14). Compara la vista de lectura con los datos de origen
        (reportes, votos de CORTE que cuentan, casos) y, con `aplicar`, la reescribe desde
        ellos y borra las filas huérfanas. Sin `aplicar` solo informa las diferencias.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aplicar: { type: boolean, default: false }
                umbralValidacion: { type: integer, minimum: 1, maximum: 100, default: 3 }
      responses:
        "200":
          description: Resultado de la comparación
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportesEnOrigen: { type: integer }
                  filasEnVista: { type: integer }
                  faltantes: { type: integer, description: Reportes sin fila en la vista }
                  sobrantes: { type: integer, description: Filas sin reporte de origen }
                  distintas: { type: integer, description: Filas con algún valor distinto al del origen }
                  distintasPorColumna: { type: object, additionalProperties: { type: integer } }
                  aplicada: { type: boolean }

  /interno/v1/indicadores/estado:
    get:
      operationId: consultarEstadoVista
      description: Cobertura y fecha de la última actualización de la vista (RNF-DAT4).
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      responses:
        "200": { description: "{reportes, municipios, primerReporte, ultimoReporte, actualizadoEn}" }

  # ------------------------------------------------- auditoría (`auditoria`)
  /interno/v1/auditoria/registros:
    post:
      operationId: registrarAuditoria
      description: |
        Solo `auditoria`. Inserta el registro encadenado (huella SHA-256 con el anterior)
        bajo bloqueo; idempotente por idEvento (200 con nuevo=false si ya existía).
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, tipo, version, origen, categoria, accion, ocurridoEn]
              properties:
                idEvento: { type: string, format: uuid }
                tipo: { type: string }
                version: { type: integer }
                origen: { type: string }
                correlationId: { type: string, format: uuid }
                categoria: { type: string }
                accion: { type: string }
                resultado: { type: string, enum: [EXITO, FALLO] }
                actorId: { type: string, format: uuid }
                actorRol: { type: string }
                recursoTipo: { type: string }
                recursoId: { type: string }
                detalle: { type: object }
                ocurridoEn: { type: string, format: date-time }
      responses:
        "201": { description: Registrado }
        "200": { description: Ya existía }
    get:
      operationId: consultarAuditoria
      description: "Solo `auditoria`. Filtros categoria, tipo, accion, actorId, recursoId, actorRol (SISTEMA = sin rol), recursoTipo, desde, hasta, pagina, tamano."
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      responses:
        "200": { description: Página de registros }

  /interno/v1/auditoria/integridad:
    get:
      operationId: verificarIntegridadAuditoria
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      responses:
        "200": { description: "{registros, integra, primeraRota, ultimoHash}" }

  /interno/v1/auditoria/segmentos:
    get:
      operationId: listarSegmentosAuditoria
      description: Segmentos archivados del registro de auditoría (ADR-29). Solo `auditoria`.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      responses:
        "200": { description: "Lista: secuenciaDesde, secuenciaHasta, registros, hashAnteriorInicial, hashFinal, claveObjeto, sha256Archivo, bytes, archivadoEn" }

  /interno/v1/auditoria/archivo:
    post:
      operationId: archivarAuditoria
      description: |
        Archiva ahora (ADR-29): sin cuerpo, los meses más viejos que la ventana en la base
        (servired.auditoria.archivo.meses-en-base); con `hasta`, todo lo registrado antes. Cada
        segmento se sube al almacén (auditoria/segmentos/), se comprueba y solo entonces se
        borran de la base los registros que cubre. No archiva un tramo cuya cadena esté rota
        (`detenidoPor`). Solo `auditoria`.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { hasta: { type: string, format: date-time } } }
      responses:
        "200": { description: "{segmentosNuevos, registrosArchivados, limite, detenidoPor}" }

  /interno/v1/auditoria/archivo/verificacion:
    post:
      operationId: verificarArchivoAuditoria
      description: Descarga cada segmento, compara su SHA-256 con el índice y recalcula sus huellas y enlaces. Solo `auditoria`.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      responses:
        "200": { description: "{segmentos, registros, integro, segmentoConProblema, problema}" }

  /interno/v1/auditoria/anclas:
    get:
      operationId: listarAnclasAuditoria
      description: Anclas diarias de la cadena (ADR-31); la API pública las sirve por medio de `auditoria`.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      responses:
        "200": { description: "Lista: fecha, secuencia, hash, registros, segmentos, publicadaEn, destino, referencia" }
    post:
      operationId: anclarAuditoria
      description: |
        Fija el ancla de hoy (si no existe) y la publica fuera del sistema si aún no se pudo. No ancla
        una cadena rota (409). Solo `auditoria`.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      responses:
        "200": { description: El ancla de hoy }
        "404": { description: La cadena está vacía }
        "409": { description: La cadena está rota }

  /interno/v1/auditoria/anclas/verificacion:
    post:
      operationId: verificarAnclasAuditoria
      description: |
        Compara las anclas publicadas afuera (GitHub; si no hay destino, las de la base) con el hash que
        hoy tiene cada secuencia, en la base o dentro de su segmento archivado. Solo `auditoria`.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      responses:
        "200": { description: "{fuente, anclas, coinciden, distintas[], reemplazadas[]}: reemplazadas son las que un reencadenamiento autorizado (auditoria.reencadenamientos, ADR-36) recalculó; no cuentan como distintas" }

  /interno/v1/acciones-auditadas:
    post:
      operationId: publicarAccionAuditada
      description: |
        identidad, reportes, atencion o indicadores. Deja un evento accion.auditada en
        el outbox (para acciones sin otra escritura, p. ej. un inicio de sesión fallido).
        Las operaciones registrarCuenta, actualizarCuenta, eliminarCuenta y
        decidirModeracion aceptan además un arreglo `eventos` con accion.auditada que
        se guarda en su misma transacción.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventoSaliente" }
      responses:
        "202": { description: En el outbox }
        "403": { description: El servicio no puede emitir ese evento }

  /interno/v1/catalogo/municipio-cercano:
    get:
      operationId: resolverMunicipio
      summary: Resolver el municipio (DIVIPOLA) más cercano a unas coordenadas
      description: |
        Centroide más cercano de la semilla DIVIPOLA (decisión D). Invocable por
        `reportes`, `atencion` e `indicadores`.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: latitud, in: query, required: true, schema: { type: number } }
        - { name: longitud, in: query, required: true, schema: { type: number } }
      responses:
        "200":
          description: Municipio resuelto
          content:
            application/json:
              schema:
                type: object
                required: [codigo, nombre, departamento]
                properties:
                  codigo: { type: string, pattern: "^[0-9]{5}$" }
                  nombre: { type: string }
                  departamento: { type: string }
        "409":
          description: Coordenadas fuera de Colombia

components:
  securitySchemes:
    claveServicio:
      type: apiKey
      in: header
      name: X-Clave-Servicio
      description: Clave propia de cada servicio (PERSISTENCIA_CLAVE_<SERVICIO> en .env)

  parameters:
    IdCorrelacion:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, format: uuid }

  schemas:
    EventoSaliente:
      description: |
        Sobre completo del evento (contratos/eventos/esquemas/sobre-evento.v1.json).
        Persistencia no interpreta `datos`; solo lo guarda y lo publica.
      type: object
      required: [idEvento, tipo, version, fechaOcurrencia, correlationId, origen, datos]
      properties:
        idEvento: { type: string, format: uuid }
        tipo: { type: string }
        version: { type: integer, minimum: 1 }
        fechaOcurrencia: { type: string, format: date-time }
        correlationId: { type: string, format: uuid }
        origen: { type: string }
        datos: { type: object }

    ReporteAGuardar:
      type: object
      required: [idReporte, idCiudadano, tipoServicio, latitud, longitud, codigoMunicipio,
                 inicioEstimado, magnitud, fechaRegistro]
      properties:
        idReporte: { type: string, format: uuid }
        idCiudadano: { type: string, format: uuid }
        tipoServicio: { type: string, enum: [ENERGIA, GAS, ACUEDUCTO, ALCANTARILLADO, ASEO] }
        latitud: { type: number }
        longitud: { type: number }
        codigoMunicipio: { type: string, pattern: "^[0-9]{5}$" }
        inicioEstimado: { type: string, format: date-time }
        magnitud: { type: string, enum: [VIVIENDA, CUADRA, BARRIO, SECTOR] }
        descripcion: { type: string, maxLength: 1000 }
        fechaRegistro: { type: string, format: date-time }

    ReporteGuardado:
      allOf:
        - $ref: "#/components/schemas/ReporteAGuardar"
        - type: object
          required: [estado, historia]
          properties:
            estado: { type: string, enum: [RECIBIDO, EN_ATENCION, RESTABLECIDO, CERRADO] }
            nombreMunicipio: { type: string }
            fechaRestablecimiento: { type: string, format: date-time }
            duracionMinutos: { type: integer }
            versionValidaciones: { type: integer, description: Versión optimista de las validaciones }
            validacionCorte: { $ref: "#/components/schemas/Conteo" }
            validacionRestablecimiento: { $ref: "#/components/schemas/Conteo" }
            evidencias:
              type: array
              items:
                type: object
                properties:
                  idEvidencia: { type: string, format: uuid }
                  tipoContenido: { type: string }
                  tamanoBytes: { type: integer }
                  creadaEn: { type: string, format: date-time }
            historia:
              type: array
              items:
                type: object
                required: [estado, fecha]
                properties:
                  estado: { type: string }
                  fecha: { type: string, format: date-time }
                  detalle: { type: string }

    Conteo:
      type: object
      properties:
        confirmaciones: { type: integer }
        controversias: { type: integer }

    FiltroVista:
      type: object
      required: [desde, hasta]
      properties:
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }
        tipoServicio: { type: string }
        codigoDepartamento: { type: string, pattern: "^[0-9]{2}$" }
        codigoMunicipio: { type: string, pattern: "^[0-9]{5}$" }
        idEmpresa: { type: string, format: uuid }
        situacion: { type: string, enum: [ACTIVO, RESUELTO] }

    CuentaAGuardar:
      type: object
      required: [idCuenta, correo, hashClave, rol, creadaEn]
      properties:
        idCuenta: { type: string, format: uuid }
        correo: { type: string, description: Normalizado por Identidad }
        hashClave: { type: string, description: bcrypt }
        rol: { type: string, enum: [CIUDADANO, OPERADOR, REGULADOR, ADMINISTRADOR] }
        idEmpresa: { type: string, format: uuid, description: Obligatoria solo para OPERADOR }
        nombre: { type: string, maxLength: 120 }
        consentimientoDatosEn: { type: string, format: date-time }
        creadaEn: { type: string, format: date-time }

    CuentaGuardada:
      type: object
      required: [idCuenta, correo, rol, activa, creadaEn]
      properties:
        idCuenta: { type: string, format: uuid }
        correo: { type: string }
        rol: { type: string }
        idEmpresa: { type: string, format: uuid }
        nombre: { type: string }
        activa: { type: boolean }
        creadaEn: { type: string, format: date-time }

    CasoAAbrir:
      type: object
      required: [idCaso, idReporte, tipoServicio, codigoMunicipio, magnitud, abiertoEn]
      properties:
        idEmpresa: { type: string, format: uuid, description: Empresa elegida por Atención (ausente sin cobertura) }
        prioridad: { type: string, enum: [BAJA, MEDIA, ALTA, CRITICA] }
        latitud: { type: number }
        longitud: { type: number }
        descripcion: { type: string, maxLength: 1000 }
        inicioEstimado: { type: string, format: date-time }
        idCaso: { type: string, format: uuid }
        idReporte: { type: string, format: uuid }
        tipoServicio: { type: string, enum: [ENERGIA, GAS, ACUEDUCTO, ALCANTARILLADO, ASEO] }
        codigoMunicipio: { type: string, pattern: "^[0-9]{5}$" }
        magnitud: { type: string, enum: [VIVIENDA, CUADRA, BARRIO, SECTOR] }
        abiertoEn: { type: string, format: date-time }

    CasoGuardado:
      allOf:
        - $ref: "#/components/schemas/CasoAAbrir"
        - type: object
          required: [estado]
          properties:
            estado: { type: string, enum: [RECIBIDO, EN_ATENCION, RESUELTO, CERRADO] }

    Problema:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string, format: uuid }

  responses:
    Conflicto:
      description: La operación no se aplicó por el estado de los datos; ver `motivo`
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              motivo: { type: string, enum: [ESTADO, VERSION, YA_VOTO, LIMITE] }
              detail: { type: string }
    Invalido:
      description: Datos inválidos
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    NoAutorizado:
      description: Falta X-Clave-Servicio o es inválida
    Prohibido:
      description: El servicio no tiene permiso para esta operación
