# Contrato interno del servicio de Persistencia (ADR-02).
# Solo accesible en la red interna; el gateway NO lo enruta.
#
# Reglas:
#  - Operaciones de NEGOCIO (guardarReporte, actualizarEstadoCaso, ...),
#    nunca un CRUD genérico de tablas. Ningún cliente conoce el esquema físico.
#  - Cada servicio se autentica con su propia clave (X-Clave-Servicio) y solo
#    puede invocar las operaciones de su dominio (mínimo privilegio).
#  - X-Correlation-Id es obligatorio y es la clave de idempotencia junto con
#    la operación: un reintento devuelve la respuesta original sin reescribir.
#  - Las operaciones que generan un evento reciben el evento ya construido por
#    el servicio dueño; Persistencia lo guarda en el outbox en la MISMA
#    transacción y lo publica después (decisión B).
# Estado: fase 3 (reportes, casos, catálogo, cuentas y sesiones).
openapi: 3.1.0
info:
  title: SERVI-RED · Persistencia (API interna)
  version: 1.0.0-fase3
servers:
  - url: http://persistencia:8080
    description: Red interna de Docker Compose

security:
  - claveServicio: []

paths:
  /interno/v1/reportes/guardar:
    post:
      operationId: guardarReporte
      summary: Guardar un reporte nuevo y su evento reporte.creado
      description: |
        Invocable solo por `reportes`. En una transacción: inserta el reporte,
        su primera entrada de historia y el evento en el outbox.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reporte, evento]
              properties:
                reporte: { $ref: "#/components/schemas/ReporteAGuardar" }
                evento: { $ref: "#/components/schemas/EventoSaliente" }
      responses:
        "201":
          description: Reporte guardado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReporteGuardado" }
        "200":
          description: Reintento de un X-Correlation-Id ya procesado; devuelve el reporte original
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReporteGuardado" }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409":
          description: |
            Viola una regla de integridad (p. ej. municipio inexistente), el evento no
            pertenece a la operación o su correlationId no coincide con X-Correlation-Id

  /interno/v1/reportes/{idReporte}:
    get:
      operationId: consultarReporte
      summary: Consultar un reporte con su historia
      description: Invocable solo por `reportes`.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - name: idReporte
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reporte encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReporteGuardado" }
        "404":
          description: No existe

  /interno/v1/casos/abrir:
    post:
      operationId: abrirCaso
      summary: Abrir el caso de atención de un reporte
      description: |
        Invocable solo por `atencion`, al consumir reporte.creado. Idempotente por
        X-Correlation-Id (el del evento) y porque hay a lo sumo un caso por
        reporte: si ya existe, devuelve el caso original con 200.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CasoAAbrir" }
      responses:
        "201":
          description: Caso abierto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CasoGuardado" }
        "200":
          description: El caso ya existía
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CasoGuardado" }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409":
          description: Municipio inexistente

  # ---------------------------------------------- identidad (solo `identidad`)
  /interno/v1/cuentas/registrar:
    post:
      operationId: registrarCuenta
      summary: Guardar una cuenta nueva (guardarUsuario)
      description: Idempotente por X-Correlation-Id. 409 si el correo ya existe o la empresa no existe.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuentaAGuardar" }
      responses:
        "201": { description: Creada, content: { application/json: { schema: { $ref: "#/components/schemas/CuentaGuardada" } } } }
        "200": { description: Reintento ya procesado, content: { application/json: { schema: { $ref: "#/components/schemas/CuentaGuardada" } } } }
        "409": { description: Correo ya registrado o viola una regla de integridad }

  /interno/v1/cuentas/credenciales:
    post:
      operationId: buscarCredenciales
      summary: Credenciales para verificar un inicio de sesión
      description: El correo va en el cuerpo (nunca en la URL). Única operación que devuelve el hash de la clave.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [correo], properties: { correo: { type: string } } }
      responses:
        "200":
          description: Credenciales
          content:
            application/json:
              schema:
                type: object
                required: [idCuenta, hashClave, rol, activa]
                properties:
                  idCuenta: { type: string, format: uuid }
                  hashClave: { type: string }
                  rol: { type: string }
                  idEmpresa: { type: string, format: uuid }
                  nombre: { type: string }
                  activa: { type: boolean }
        "404": { description: No existe (o fue eliminada) }

  /interno/v1/cuentas:
    get:
      operationId: listarCuentas
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: rol, in: query, schema: { type: string } }
        - { name: pagina, in: query, schema: { type: integer } }
        - { name: tamano, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: Página
          content:
            application/json:
              schema:
                type: object
                properties:
                  elementos: { type: array, items: { $ref: "#/components/schemas/CuentaGuardada" } }
                  total: { type: integer }
                  pagina: { type: integer }
                  tamano: { type: integer }

  /interno/v1/cuentas/{idCuenta}:
    get:
      operationId: consultarCuenta
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idCuenta, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Cuenta, content: { application/json: { schema: { $ref: "#/components/schemas/CuentaGuardada" } } } }
        "404": { description: No existe }

  /interno/v1/cuentas/{idCuenta}/actualizar:
    post:
      operationId: actualizarCuenta
      description: Cambios parciales. Desactivar o cambiar el hash de la clave revoca todas las sesiones.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idCuenta, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string }
                activa: { type: boolean }
                idEmpresa: { type: string, format: uuid }
                hashClave: { type: string }
      responses:
        "200": { description: Actualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CuentaGuardada" } } } }
        "404": { description: No existe }

  /interno/v1/cuentas/{idCuenta}/eliminar:
    post:
      operationId: eliminarCuenta
      description: Anonimiza correo y nombre, invalida la clave y revoca las sesiones.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: idCuenta, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Eliminada }
        "404": { description: No existe }

  /interno/v1/sesiones/abrir:
    post:
      operationId: abrirSesion
      description: Solo se guarda el SHA-256 (hex) del token de refresco.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idSesion, idCuenta, hashRefresco, expiraEn]
              properties:
                idSesion: { type: string, format: uuid }
                idCuenta: { type: string, format: uuid }
                hashRefresco: { type: string, pattern: "^[0-9a-f]{64}$" }
                expiraEn: { type: string, format: date-time }
      responses:
        "201": { description: Sesión abierta }

  /interno/v1/sesiones/rotar:
    post:
      operationId: rotarSesion
      description: |
        Revoca la sesión actual y abre la nueva en una transacción. Si la sesión
        ya estaba revocada (reutilización) revoca todas las de la cuenta.
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hashRefrescoActual, idSesionNueva, hashRefrescoNuevo, expiraEn]
              properties:
                hashRefrescoActual: { type: string, pattern: "^[0-9a-f]{64}$" }
                idSesionNueva: { type: string, format: uuid }
                hashRefrescoNuevo: { type: string, pattern: "^[0-9a-f]{64}$" }
                expiraEn: { type: string, format: date-time }
      responses:
        "200":
          description: Rotada
          content:
            application/json:
              schema: { type: object, properties: { cuenta: { $ref: "#/components/schemas/CuentaGuardada" } } }
        "409":
          description: Sesión inválida
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  motivo: { type: string, enum: [INEXISTENTE, EXPIRADA, CUENTA_INACTIVA, REUTILIZADA] }

  /interno/v1/sesiones/cerrar:
    post:
      operationId: cerrarSesion
      parameters: [{ $ref: "#/components/parameters/IdCorrelacion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [hashRefresco], properties: { hashRefresco: { type: string } } }
      responses:
        "204": { description: Cerrada (idempotente) }

  /interno/v1/catalogo/municipio-cercano:
    get:
      operationId: resolverMunicipio
      summary: Resolver el municipio (DIVIPOLA) más cercano a unas coordenadas
      description: |
        Centroide más cercano de la semilla DIVIPOLA (decisión D). Invocable por
        `reportes`, `atencion` e `indicadores`.
      parameters:
        - $ref: "#/components/parameters/IdCorrelacion"
        - { name: latitud, in: query, required: true, schema: { type: number } }
        - { name: longitud, in: query, required: true, schema: { type: number } }
      responses:
        "200":
          description: Municipio resuelto
          content:
            application/json:
              schema:
                type: object
                required: [codigo, nombre, departamento]
                properties:
                  codigo: { type: string, pattern: "^[0-9]{5}$" }
                  nombre: { type: string }
                  departamento: { type: string }
        "409":
          description: Coordenadas fuera de Colombia

components:
  securitySchemes:
    claveServicio:
      type: apiKey
      in: header
      name: X-Clave-Servicio
      description: Clave propia de cada servicio (PERSISTENCIA_CLAVE_<SERVICIO> en .env)

  parameters:
    IdCorrelacion:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, format: uuid }

  schemas:
    EventoSaliente:
      description: |
        Sobre completo del evento (contratos/eventos/esquemas/sobre-evento.v1.json).
        Persistencia no interpreta `datos`; solo lo guarda y lo publica.
      type: object
      required: [idEvento, tipo, version, fechaOcurrencia, correlationId, origen, datos]
      properties:
        idEvento: { type: string, format: uuid }
        tipo: { type: string }
        version: { type: integer, minimum: 1 }
        fechaOcurrencia: { type: string, format: date-time }
        correlationId: { type: string, format: uuid }
        origen: { type: string }
        datos: { type: object }

    ReporteAGuardar:
      type: object
      required: [idReporte, idCiudadano, tipoServicio, latitud, longitud, codigoMunicipio,
                 inicioEstimado, magnitud, fechaRegistro]
      properties:
        idReporte: { type: string, format: uuid }
        idCiudadano: { type: string, format: uuid }
        tipoServicio: { type: string, enum: [ENERGIA, GAS, ACUEDUCTO, ALCANTARILLADO, ASEO] }
        latitud: { type: number }
        longitud: { type: number }
        codigoMunicipio: { type: string, pattern: "^[0-9]{5}$" }
        inicioEstimado: { type: string, format: date-time }
        magnitud: { type: string, enum: [VIVIENDA, CUADRA, BARRIO, SECTOR] }
        descripcion: { type: string, maxLength: 1000 }
        fechaRegistro: { type: string, format: date-time }

    ReporteGuardado:
      allOf:
        - $ref: "#/components/schemas/ReporteAGuardar"
        - type: object
          required: [estado, historia]
          properties:
            estado: { type: string, enum: [RECIBIDO, EN_ATENCION, RESTABLECIDO, CERRADO] }
            nombreMunicipio: { type: string }
            historia:
              type: array
              items:
                type: object
                required: [estado, fecha]
                properties:
                  estado: { type: string }
                  fecha: { type: string, format: date-time }
                  detalle: { type: string }

    CuentaAGuardar:
      type: object
      required: [idCuenta, correo, hashClave, rol, creadaEn]
      properties:
        idCuenta: { type: string, format: uuid }
        correo: { type: string, description: Normalizado por Identidad }
        hashClave: { type: string, description: bcrypt }
        rol: { type: string, enum: [CIUDADANO, OPERADOR, REGULADOR, ADMINISTRADOR] }
        idEmpresa: { type: string, format: uuid, description: Obligatoria solo para OPERADOR }
        nombre: { type: string, maxLength: 120 }
        consentimientoDatosEn: { type: string, format: date-time }
        creadaEn: { type: string, format: date-time }

    CuentaGuardada:
      type: object
      required: [idCuenta, correo, rol, activa, creadaEn]
      properties:
        idCuenta: { type: string, format: uuid }
        correo: { type: string }
        rol: { type: string }
        idEmpresa: { type: string, format: uuid }
        nombre: { type: string }
        activa: { type: boolean }
        creadaEn: { type: string, format: date-time }

    CasoAAbrir:
      type: object
      required: [idCaso, idReporte, tipoServicio, codigoMunicipio, magnitud, abiertoEn]
      properties:
        idCaso: { type: string, format: uuid }
        idReporte: { type: string, format: uuid }
        tipoServicio: { type: string, enum: [ENERGIA, GAS, ACUEDUCTO, ALCANTARILLADO, ASEO] }
        codigoMunicipio: { type: string, pattern: "^[0-9]{5}$" }
        magnitud: { type: string, enum: [VIVIENDA, CUADRA, BARRIO, SECTOR] }
        abiertoEn: { type: string, format: date-time }

    CasoGuardado:
      allOf:
        - $ref: "#/components/schemas/CasoAAbrir"
        - type: object
          required: [estado]
          properties:
            estado: { type: string, enum: [RECIBIDO, EN_ATENCION, RESUELTO, CERRADO] }

    Problema:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string, format: uuid }

  responses:
    Invalido:
      description: Datos inválidos
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    NoAutorizado:
      description: Falta X-Clave-Servicio o es inválida
    Prohibido:
      description: El servicio no tiene permiso para esta operación
