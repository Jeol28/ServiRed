# =====================================================================
# SERVI-RED · entorno local
# Se usa desde la raíz con:  docker compose up -d --build --wait
# (compose.yaml de la raíz incluye este archivo; las variables vienen de .env)
#
# Redes:
#   interna -> red aislada (internal: true): microservicios, RabbitMQ y BD
#   borde   -> red con salida: gateway (puerto 8080), portales web (4300
#              público, 127.0.0.1:4200 operación), consola de RabbitMQ
#              (solo 127.0.0.1) y persistencia (salida hacia Supabase)
# =====================================================================

name: servired

x-servicio-base: &servicio-base
  restart: unless-stopped
  networks: [interna]
  environment: &entorno-rabbit
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PUERTO: "5672"
    RABBITMQ_USUARIO: ${RABBITMQ_USUARIO:?definir en .env}
    RABBITMQ_CLAVE: ${RABBITMQ_CLAVE:?definir en .env}
    # Trazas (perfil observabilidad): activar con TRAZAS_ACTIVAS=true en .env.
    TRAZAS_ACTIVAS: ${TRAZAS_ACTIVAS:-false}
    OTLP_TRAZAS_URL: http://jaeger:4318/v1/traces
  depends_on: &depende-rabbit
    rabbitmq-init:
      condition: service_completed_successfully

services:

  # ------------------------------------------------------------------
  # Infraestructura
  # ------------------------------------------------------------------
  postgres-local:
    # Base de datos local que reemplaza a Supabase en desarrollo. Para usar
    # Supabase basta con cambiar PERSISTENCIA_DB_URL en .env.
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [interna]
    environment:
      POSTGRES_DB: servired
      POSTGRES_USER: ${POSTGRES_LOCAL_USUARIO:?definir en .env}
      POSTGRES_PASSWORD: ${POSTGRES_LOCAL_CLAVE:?definir en .env}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d servired"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    networks: [interna, borde]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_CLAVE}
    ports:
      - "127.0.0.1:15672:15672"   # consola de administración, solo localhost
    volumes:
      - datos-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20

  almacen:
    # Almacén de evidencias compatible con S3 (SeaweedFS) que reemplaza a
    # Supabase Storage en desarrollo. Solo persistencia lo usa; sin puertos
    # publicados. Para Supabase basta con cambiar ALMACEN_S3_* en .env.
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    networks: [interna]
    environment:
      ALMACEN_S3_ACCESO: ${ALMACEN_S3_ACCESO:?definir en .env}
      ALMACEN_S3_SECRETO: ${ALMACEN_S3_SECRETO:?definir en .env}
    entrypoint: ["/bin/sh", "/iniciar-almacen.sh"]
    volumes:
      - ./almacen/iniciar-almacen.sh:/iniciar-almacen.sh:ro
      - datos-almacen:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq-init:
    # Aplica exchanges, colas (con reintento y DLQ) y bindings, y termina.
    image: curlimages/curl:8.11.1
    networks: [interna]
    environment:
      RABBITMQ_USUARIO: ${RABBITMQ_USUARIO}
      RABBITMQ_CLAVE: ${RABBITMQ_CLAVE}
    volumes:
      - ./rabbitmq:/definiciones:ro
    entrypoint: ["/bin/sh", "/definiciones/aplicar-definiciones.sh"]
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Microservicios
  # ------------------------------------------------------------------
  persistencia:
    <<: *servicio-base
    build: ../servicios/persistencia
    networks: [interna, borde]   # necesita salida para llegar a Supabase
    environment:
      <<: *entorno-rabbit
      PERSISTENCIA_DB_URL: ${PERSISTENCIA_DB_URL:?definir en .env}
      PERSISTENCIA_DB_USUARIO: ${PERSISTENCIA_DB_USUARIO:?definir en .env}
      PERSISTENCIA_DB_CLAVE: ${PERSISTENCIA_DB_CLAVE:?definir en .env}
      # Una clave por servicio cliente (mínimo privilegio por operación).
      PERSISTENCIA_CLAVE_IDENTIDAD: ${PERSISTENCIA_CLAVE_IDENTIDAD:?definir en .env}
      PERSISTENCIA_CLAVE_REPORTES: ${PERSISTENCIA_CLAVE_REPORTES:?definir en .env}
      PERSISTENCIA_CLAVE_ATENCION: ${PERSISTENCIA_CLAVE_ATENCION:?definir en .env}
      PERSISTENCIA_CLAVE_INDICADORES: ${PERSISTENCIA_CLAVE_INDICADORES:?definir en .env}
      PERSISTENCIA_CLAVE_AUDITORIA: ${PERSISTENCIA_CLAVE_AUDITORIA:?definir en .env}
      ALMACEN_S3_URL: ${ALMACEN_S3_URL:-http://almacen:8333}
      ALMACEN_S3_REGION: ${ALMACEN_S3_REGION:-us-east-1}
      ALMACEN_S3_ACCESO: ${ALMACEN_S3_ACCESO:?definir en .env}
      ALMACEN_S3_SECRETO: ${ALMACEN_S3_SECRETO:?definir en .env}
      ALMACEN_S3_BUCKET: ${ALMACEN_S3_BUCKET:-evidencias}
      ALMACEN_S3_CREAR_BUCKET: ${ALMACEN_S3_CREAR_BUCKET:-true}
    depends_on:
      <<: *depende-rabbit
      postgres-local:
        condition: service_healthy
      almacen:
        condition: service_healthy

  identidad:
    <<: *servicio-base
    build: ../servicios/identidad
    environment:
      PERSISTENCIA_URL: http://persistencia:8080
      PERSISTENCIA_CLAVE: ${PERSISTENCIA_CLAVE_IDENTIDAD:?definir en .env}
      TRAZAS_ACTIVAS: ${TRAZAS_ACTIVAS:-false}
      OTLP_TRAZAS_URL: http://jaeger:4318/v1/traces
      IDENTIDAD_JWT_CLAVE_PRIVADA: ${IDENTIDAD_JWT_CLAVE_PRIVADA:-}
      IDENTIDAD_ADMIN_CORREO: ${IDENTIDAD_ADMIN_CORREO:-}
      IDENTIDAD_ADMIN_CLAVE: ${IDENTIDAD_ADMIN_CLAVE:-}
    depends_on:
      persistencia:
        condition: service_healthy

  reportes:
    <<: *servicio-base
    build: ../servicios/reportes
    environment:
      <<: *entorno-rabbit
      PERSISTENCIA_URL: http://persistencia:8080
      PERSISTENCIA_CLAVE: ${PERSISTENCIA_CLAVE_REPORTES:?definir en .env}
      # Antigüedad mínima de la cuenta para que su voto sume a la validación (ADR-22).
      VALIDACION_ANTIGUEDAD_MINIMA_CUENTA: ${VALIDACION_ANTIGUEDAD_MINIMA_CUENTA:-24h}
    depends_on:
      <<: *depende-rabbit
      persistencia:
        condition: service_healthy

  atencion:
    <<: *servicio-base
    build: ../servicios/atencion
    environment:
      <<: *entorno-rabbit
      PERSISTENCIA_URL: http://persistencia:8080
      PERSISTENCIA_CLAVE: ${PERSISTENCIA_CLAVE_ATENCION:?definir en .env}
    depends_on:
      <<: *depende-rabbit
      persistencia:
        condition: service_healthy

  indicadores:
    <<: *servicio-base
    build: ../servicios/indicadores
    environment:
      <<: *entorno-rabbit
      PERSISTENCIA_URL: http://persistencia:8080
      PERSISTENCIA_CLAVE: ${PERSISTENCIA_CLAVE_INDICADORES:?definir en .env}
    depends_on:
      <<: *depende-rabbit
      persistencia:
        condition: service_healthy

  auditoria:
    <<: *servicio-base
    build: ../servicios/auditoria
    environment:
      <<: *entorno-rabbit
      PERSISTENCIA_URL: http://persistencia:8080
      PERSISTENCIA_CLAVE: ${PERSISTENCIA_CLAVE_AUDITORIA:?definir en .env}
      # Token del webhook interno de Alertmanager (RF-13).
      ALERTAS_TOKEN: ${ALERTAS_TOKEN:?definir en .env}
    depends_on:
      <<: *depende-rabbit
      persistencia:
        condition: service_healthy

  gateway:
    build: ../servicios/gateway
    restart: unless-stopped
    networks: [borde, interna]
    environment:
      TRAZAS_ACTIVAS: ${TRAZAS_ACTIVAS:-false}
      OTLP_TRAZAS_URL: http://jaeger:4318/v1/traces
      # Solo de estos proxies se acepta X-Forwarded-For (límite de abuso por cliente).
      PROXIES_CONFIABLES: portal-publico,portal-operador
      # Cuentas nuevas por IP y por hora (ADR-22). Súbalo solo en entornos de prueba que
      # registran muchas cuentas desde una misma máquina.
      LIMITE_REGISTROS_POR_HORA: ${LIMITE_REGISTROS_POR_HORA:-30}
    ports:
      - "8080:8080"
    depends_on:
      identidad:   { condition: service_healthy }
      reportes:    { condition: service_healthy }
      atencion:    { condition: service_healthy }
      indicadores: { condition: service_healthy }

  # ------------------------------------------------------------------
  # Portales web (Angular + nginx). Solo hablan con el gateway (ADR-17).
  # ------------------------------------------------------------------
  portal-publico:
    build:
      context: ../clientes/web
      args:
        PROYECTO: portal-publico
    restart: unless-stopped
    networks: [borde]
    ports:
      - "4300:8080"
    depends_on:
      gateway: { condition: service_healthy }

  portal-operador:
    build:
      context: ../clientes/web
      args:
        PROYECTO: portal-operador
    restart: unless-stopped
    networks: [borde]
    # Portal del personal: solo en la máquina local.
    ports:
      - "127.0.0.1:4200:8080"
    depends_on:
      gateway: { condition: service_healthy }

  # ------------------------------------------------------------------
  # Observabilidad (opcional):  docker compose --profile observabilidad up -d
  # Consolas solo en 127.0.0.1. Ver ADR-16.
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observabilidad]
    restart: unless-stopped
    networks: [interna, borde]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidad/reglas.yml:/etc/prometheus/reglas.yml:ro
      - datos-prometheus:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [observabilidad]
    restart: unless-stopped
    networks: [interna, borde]
    environment:
      ALERTAS_TOKEN: ${ALERTAS_TOKEN:?definir en .env}
    entrypoint: ["/bin/sh", "/iniciar-alertmanager.sh"]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./observabilidad/iniciar-alertmanager.sh:/iniciar-alertmanager.sh:ro

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observabilidad]
    restart: unless-stopped
    networks: [interna, borde]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_CLAVE:?definir en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/tableros:/var/lib/grafana/tableros:ro

  jaeger:
    # Recibe trazas por OTLP (4317/4318, solo red interna); UI en 127.0.0.1:16686.
    image: jaegertracing/jaeger:2.9.0
    profiles: [observabilidad]
    restart: unless-stopped
    networks: [interna, borde]
    ports: ["127.0.0.1:16686:16686"]

networks:
  borde:
  interna:
    internal: true   # sin salida a Internet ni puertos publicados

volumes:
  datos-prometheus:
  datos-almacen:
  datos-postgres:
  datos-rabbitmq:
