# Prometheus de SERVI-RED (perfil "observabilidad"). Raspa a los servicios por
# la red interna; ninguno publica sus métricas hacia fuera.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/reglas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Los servicios se descubren por DNS: con `docker compose up --scale` cada réplica es
# un objetivo propio (instance = IP:puerto). Ver ADR-20.
scrape_configs:
  - job_name: gateway                      # actuator en el puerto de gestión (no publicado)
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["gateway:8081"] }]
  - job_name: identidad
    metrics_path: /actuator/prometheus
    dns_sd_configs: [{ names: ["identidad"], type: A, port: 8080 }]
  - job_name: reportes
    metrics_path: /actuator/prometheus
    dns_sd_configs: [{ names: ["reportes"], type: A, port: 8080 }]
  - job_name: persistencia
    metrics_path: /actuator/prometheus
    dns_sd_configs: [{ names: ["persistencia"], type: A, port: 8080 }]
  - job_name: atencion
    metrics_path: /metrics
    dns_sd_configs: [{ names: ["atencion"], type: A, port: 8080 }]
  - job_name: indicadores
    metrics_path: /metrics
    dns_sd_configs: [{ names: ["indicadores"], type: A, port: 8080 }]
  - job_name: rabbitmq                     # métricas por cola (DLQ, reintentos)
    metrics_path: /metrics/per-object
    static_configs: [{ targets: ["rabbitmq:15692"] }]
