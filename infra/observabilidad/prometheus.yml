# Prometheus de SERVI-RED (perfil "observabilidad"). Raspa a los servicios por
# la red interna; ninguno publica sus métricas hacia fuera.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/reglas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateway                      # actuator en el puerto de gestión (no publicado)
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["gateway:8081"] }]
  - job_name: identidad
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["identidad:8080"] }]
  - job_name: reportes
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["reportes:8080"] }]
  - job_name: persistencia
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["persistencia:8080"] }]
  - job_name: atencion
    metrics_path: /metrics
    static_configs: [{ targets: ["atencion:8080"] }]
  - job_name: indicadores
    metrics_path: /metrics
    static_configs: [{ targets: ["indicadores:8080"] }]
  - job_name: auditoria
    metrics_path: /metrics
    static_configs: [{ targets: ["auditoria:8080"] }]
  - job_name: rabbitmq                     # métricas por cola (DLQ, reintentos)
    metrics_path: /metrics/per-object
    static_configs: [{ targets: ["rabbitmq:15692"] }]
