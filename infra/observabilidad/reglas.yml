# Alertas de SERVI-RED (RF-13, ADR-16). Alertmanager las envía a Auditoría,
# que las deja en el registro de auditoría (categoría ALERTA).
groups:
  - name: servired-operacion
    rules:
      - alert: ServicioCaido
        expr: up == 0
        for: 1m
        labels: { severity: critica }
        annotations:
          summary: "{{ $labels.job }} no responde a Prometheus desde hace 1 minuto"

      # Con descubrimiento por DNS, una réplica que muere deja de ser objetivo: si mueren
      # todas, up == 0 no se dispara. Esta alerta cubre «ninguna réplica viva» (ADR-20).
      - alert: ServicioSinReplicas
        expr: |
          absent(up{job="persistencia"} == 1) or absent(up{job="reportes"} == 1)
          or absent(up{job="identidad"} == 1) or absent(up{job="atencion"} == 1)
          or absent(up{job="indicadores"} == 1) or absent(up{job="auditoria"} == 1)
        for: 1m
        labels: { severity: critica }
        annotations:
          summary: "{{ $labels.job }} no tiene ninguna réplica viva desde hace 1 minuto"

      - alert: CircuitoPersistenciaAbierto
        expr: |
          resilience4j_circuitbreaker_state{name="persistencia", state="open"} == 1
          or servired_circuito_persistencia_estado == 1
        for: 1m
        labels: { severity: critica }
        annotations:
          summary: "{{ $labels.job }} tiene abierto el circuito hacia Persistencia: falla rápido sus solicitudes"

      - alert: MensajesEnColaDeFallidos
        expr: rabbitmq_queue_messages_ready{queue=~".+\\.dlq"} > 0
        for: 1m
        labels: { severity: alta }
        annotations:
          summary: "{{ $value }} mensaje(s) en {{ $labels.queue }}: un consumidor no pudo procesarlos"

      # Antigüedad de los mensajes (RNF-R3, ADR-21). Contar mensajes no dice cuánto esperan:
      # se mide la edad del más viejo en el outbox (exacta) y en cada cola (cota superior con
      # la sonda, margen de 2 s). Las tres reglas exigen que la sonda se esté publicando:
      # si Persistencia está caída ya avisan ServicioSinReplicas y CircuitoPersistenciaAbierto.
      - alert: ReporteNoVisibleATiempo
        # RNF-R3: un reporte aceptado debe ser visible para el operador en máximo 10 s.
        # Espera en el outbox + espera en la cola de Atención (la réplica más al día).
        expr: |
          (
            min(servired_cola_mensaje_mas_viejo_segundos{cola="atencion.eventos-reportes"})
            + max(servired_outbox_mensaje_mas_viejo_segundos)
          ) > 10
          and on() min(servired_sonda_ultima_publicacion_segundos) < 10
        for: 30s
        labels: { severity: critica, servicio: atencion }
        annotations:
          summary: "Hay reportes esperando {{ $value | humanizeDuration }} para llegar al operador (RNF-R3: máximo 10 s)"

      - alert: MensajeViejoEnCola
        expr: |
          min by (cola) (servired_cola_mensaje_mas_viejo_segundos{cola!="atencion.eventos-reportes"}) > 60
          and on() min(servired_sonda_ultima_publicacion_segundos) < 10
        for: 1m
        labels: { severity: media }
        annotations:
          summary: "El mensaje más viejo de {{ $labels.cola }} lleva {{ $value | humanizeDuration }} esperando: el consumidor no da abasto o está atascado"

      - alert: EventoViejoEnOutbox
        expr: max(servired_outbox_mensaje_mas_viejo_segundos) > 10
        for: 30s
        labels: { severity: alta, servicio: persistencia }
        annotations:
          summary: "Un evento lleva {{ $value | humanizeDuration }} guardado sin publicar: revisar RabbitMQ y el relay del outbox"

      - alert: ColaDeEventosAcumulada
        expr: rabbitmq_queue_messages_ready{queue=~"[a-z]+\\.eventos(-[a-z]+)?"} > 500
        for: 5m
        labels: { severity: media }
        annotations:
          summary: "{{ $labels.queue }} acumula {{ $value }} eventos: el consumidor no da abasto o está caído"

      - alert: OutboxAtascado
        expr: servired_outbox_pendientes > 20
        for: 2m
        labels: { severity: alta, servicio: persistencia }
        annotations:
          summary: "{{ $value }} eventos guardados sin publicar: revisar RabbitMQ y el relay del outbox"

      - alert: FallosPublicandoEventos
        expr: increase(servired_outbox_fallos_total[5m]) > 0
        labels: { severity: media, servicio: persistencia }
        annotations:
          summary: "El relay del outbox no pudo publicar eventos en los últimos 5 minutos"

      - alert: TasaDeErrores5xx
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (job) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: alta }
        annotations:
          summary: "Más del 5 % de las peticiones de {{ $labels.job }} terminan en error 5xx"

      - alert: TasaDeErrores5xxDotnet
        expr: |
          sum by (job) (rate(http_requests_received_total{code=~"5.."}[5m]))
            / sum by (job) (rate(http_requests_received_total[5m])) > 0.05
        for: 5m
        labels: { severity: alta }
        annotations:
          summary: "Más del 5 % de las peticiones de {{ $labels.job }} terminan en error 5xx"

      - alert: LatenciaAlta
        # RNF de rendimiento: el 95 % de las operaciones en máximo 2 segundos.
        expr: |
          histogram_quantile(0.95, sum by (le, job) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 2
        for: 5m
        labels: { severity: media }
        annotations:
          summary: "El percentil 95 de {{ $labels.job }} supera 2 s ({{ $value }} s)"

  - name: servired-seguridad
    rules:
      - alert: AlertaDeSeguridadDetectada
        expr: increase(servired_alertas_seguridad_total[5m]) > 0
        labels: { severity: alta, servicio: auditoria }
        annotations:
          summary: "Auditoría detectó {{ $labels.tipo }} (severidad {{ $labels.severidad }})"

      - alert: IniciosDeSesionFallidosFrecuentes
        expr: sum(increase(servired_acciones_auditadas_total{accion="INICIO_SESION_FALLIDO"}[5m])) > 20
        labels: { severity: alta, servicio: identidad }
        annotations:
          summary: "{{ $value }} inicios de sesión fallidos en 5 minutos"

      - alert: AccesosDenegadosEnGateway
        expr: sum(increase(http_server_requests_seconds_count{job="gateway",status=~"401|403"}[5m])) > 50
        labels: { severity: media, servicio: gateway }
        annotations:
          summary: "{{ $value }} peticiones rechazadas por autenticación o permisos en 5 minutos"

      - alert: LimiteDeAbusoActivado
        expr: sum(increase(http_server_requests_seconds_count{job="gateway",status="429"}[5m])) > 10
        labels: { severity: media, servicio: gateway }
        annotations:
          summary: "El límite de abuso rechazó {{ $value }} peticiones en 5 minutos"
