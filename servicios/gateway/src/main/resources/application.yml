server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Minimización (RNF-SEG4): la IP del cliente no viaja a los servicios.
          # El gateway no agrega X-Forwarded-*/Forwarded y descarta los que lleguen.
          # Sin timeout de respuesta, una solicitud en curso hacia una réplica que muere de
          # golpe (su IP desaparece y nadie cierra la conexión) quedaba colgada. Con el timeout,
          # el Retry de más abajo repite el GET en otra réplica (ADR-20).
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          x-forwarded:
            enabled: false
          forwarded:
            enabled: false
          default-filters:
            - RemoveRequestHeader=X-Forwarded-For
            - RemoveRequestHeader=X-Real-IP
            - RemoveRequestHeader=Forwarded
            # Con varias réplicas (ADR-20): si la conexión con una réplica falla, un GET se
            # repite (la siguiente conexión va a otra). Solo errores de conexión: un 5xx de
            # un servicio NO se reintenta (sumaría carga a una caída); la serie INFORMATIONAL
            # anula el reintento por estado, que por defecto aplica a los 5xx.
            - name: Retry
              args:
                retries: 2
                methods: GET
                series: INFORMATIONAL
                exceptions: java.io.IOException, java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 200ms
                  factor: 2
                  basedOnPreviousValue: false
          # Los clientes solo conocen /api/v1/**. Persistencia NUNCA se enruta;
          # de auditoría solo se expone la consulta (GET /api/v1/auditoria/**).
          routes:
            - id: identidad
              uri: ${SERVICIO_IDENTIDAD_URL:http://identidad:8080}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/cuentas,/api/v1/cuentas/**
            - id: reportes
              uri: ${SERVICIO_REPORTES_URL:http://reportes:8080}
              predicates:
                - Path=/api/v1/reportes,/api/v1/reportes/**
            # Denuncias anónimas (ADR-09): se descarta cualquier credencial para
            # que el servicio no pueda asociar la denuncia a una cuenta.
            - id: denuncias
              uri: ${SERVICIO_REPORTES_URL:http://reportes:8080}
              predicates:
                - Path=/api/v1/denuncias,/api/v1/denuncias/**
              filters:
                - RemoveRequestHeader=Authorization
                - RemoveRequestHeader=Cookie
            - id: atencion
              uri: ${SERVICIO_ATENCION_URL:http://atencion:8080}
              predicates:
                - Path=/api/v1/casos,/api/v1/casos/**,/api/v1/moderacion/**
            # Auditoría: solo la consulta /api/v1/auditoria/** (nunca /interno/**).
            - id: auditoria
              uri: ${SERVICIO_AUDITORIA_URL:http://auditoria:8080}
              predicates:
                - Path=/api/v1/auditoria/**
                - Method=GET
            - id: indicadores
              uri: ${SERVICIO_INDICADORES_URL:http://indicadores:8080}
              predicates:
                - Path=/api/v1/indicadores/**,/api/v1/mapas/**,/api/v1/datos-abiertos/**

servired:
  jwt:
    jwks-url: ${IDENTIDAD_JWKS_URL:http://identidad:8080/.well-known/jwks.json}
    emisor: servired-identidad
    audiencia: servired-api
  limites:
    autenticacion-por-minuto: 20
    denuncias-por-minuto: 5
    # Escrituras de cada cuenta (sub del JWT, no IP: compensación T4). Por hora es el límite;
    # por minuto frena ráfagas. Ver ADR-22.
    por-cuenta:
      reportes-por-minuto: 5
      reportes-por-hora: 10
      validaciones-por-minuto: 10
      validaciones-por-hora: 30
      fotos-por-minuto: 10
      fotos-por-hora: 30
    # Proxies propios (nginx de los portales) cuyo X-Forwarded-For se acepta
    # para el límite por cliente. Nombres de host separados por coma.
    proxies-confiables: ${PROXIES_CONFIABLES:}

management:
  # Trazas: desactivadas salvo TRAZAS_ACTIVAS=true (perfil observabilidad, Jaeger).
  tracing:
    enabled: ${TRAZAS_ACTIVAS:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRAZAS_URL:http://jaeger:4318/v1/traces}
  # Actuator (métricas incluidas) solo en el puerto de gestión, que no se
  # publica fuera de la red interna. Hacia fuera solo /livez y /readyz.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      servicio: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
