server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Los clientes solo conocen /api/v1/**. Persistencia y auditoría
          # NUNCA se enrutan: no son accesibles desde fuera.
          routes:
            - id: identidad
              uri: ${SERVICIO_IDENTIDAD_URL:http://identidad:8080}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/cuentas,/api/v1/cuentas/**
            - id: reportes
              uri: ${SERVICIO_REPORTES_URL:http://reportes:8080}
              predicates:
                - Path=/api/v1/reportes,/api/v1/reportes/**
            # Denuncias anónimas (ADR-09): se descarta cualquier credencial para
            # que el servicio no pueda asociar la denuncia a una cuenta.
            - id: denuncias
              uri: ${SERVICIO_REPORTES_URL:http://reportes:8080}
              predicates:
                - Path=/api/v1/denuncias,/api/v1/denuncias/**
              filters:
                - RemoveRequestHeader=Authorization
                - RemoveRequestHeader=Cookie
            - id: atencion
              uri: ${SERVICIO_ATENCION_URL:http://atencion:8080}
              predicates:
                - Path=/api/v1/casos,/api/v1/casos/**
            - id: indicadores
              uri: ${SERVICIO_INDICADORES_URL:http://indicadores:8080}
              predicates:
                - Path=/api/v1/indicadores/**,/api/v1/mapas/**,/api/v1/datos-abiertos/**

servired:
  jwt:
    jwks-url: ${IDENTIDAD_JWKS_URL:http://identidad:8080/.well-known/jwks.json}
    emisor: servired-identidad
    audiencia: servired-api
  limites:
    autenticacion-por-minuto: 20
    denuncias-por-minuto: 5

management:
  # Actuator (métricas incluidas) solo en el puerto de gestión, que no se
  # publica fuera de la red interna. Hacia fuera solo /livez y /readyz.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  metrics:
    tags:
      servicio: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
