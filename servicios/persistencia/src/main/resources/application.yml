server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: persistencia
  # Único servicio con credenciales de la base de datos (ADR-02).
  datasource:
    url: ${PERSISTENCIA_DB_URL:jdbc:postgresql://localhost:5432/servired}
    username: ${PERSISTENCIA_DB_USUARIO:servired}
    password: ${PERSISTENCIA_DB_CLAVE:servired}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      pool-name: pool-supabase
  flyway:
    locations: classpath:db/migracion
    # Flyway guarda su historial fuera de los esquemas de negocio.
    default-schema: infraestructura
    create-schemas: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PUERTO:5672}
    username: ${RABBITMQ_USUARIO:guest}
    password: ${RABBITMQ_CLAVE:guest}
    template:
      observation-enabled: true
    # Confirmación del broker en cada publicación del relay del outbox.
    publisher-confirm-type: simple
    publisher-returns: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

servired:
  # Clave de cada servicio que puede invocar operaciones (mínimo 16 caracteres;
  # vacía = servicio deshabilitado).
  claves:
    identidad: ${PERSISTENCIA_CLAVE_IDENTIDAD:}
    reportes: ${PERSISTENCIA_CLAVE_REPORTES:}
    atencion: ${PERSISTENCIA_CLAVE_ATENCION:}
    indicadores: ${PERSISTENCIA_CLAVE_INDICADORES:}
    auditoria: ${PERSISTENCIA_CLAVE_AUDITORIA:}
  almacen:
    # Endpoint S3: SeaweedFS local por defecto; para Supabase Storage use
    # https://<proyecto>.supabase.co/storage/v1/s3 con sus claves S3.
    url: ${ALMACEN_S3_URL:http://almacen:8333}
    region: ${ALMACEN_S3_REGION:us-east-1}
    acceso: ${ALMACEN_S3_ACCESO:servired}
    secreto: ${ALMACEN_S3_SECRETO:servired}
    bucket: ${ALMACEN_S3_BUCKET:evidencias}
    crear-bucket: ${ALMACEN_S3_CREAR_BUCKET:true}
    # Borra las fotos sin evidencia en la base (objetos huérfanos, ADR-25). No toca las
    # subidas en la última hora (gracia) y no borra nada si los huérfanos son 5 o más y
    # superan el 20 % de lo revisado (freno ante una base y un bucket cruzados).
    limpieza:
      activa: ${ALMACEN_LIMPIEZA_ACTIVA:true}
      intervalo: ${ALMACEN_LIMPIEZA_INTERVALO:PT6H}
      retraso-inicial: PT10M
      gracia: PT1H
      freno-minimo: 5
      freno-proporcion: 0.2
  # Archivado del registro de auditoría conservando la cadena de huellas (ADR-29): cada día,
  # los meses más viejos que la ventana pasan a segmentos en el almacén (auditoria/segmentos/).
  auditoria:
    archivo:
      activo: ${AUDITORIA_ARCHIVO_ACTIVO:true}
      meses-en-base: ${AUDITORIA_MESES_EN_BASE:12}
      maximo-por-segmento: 50000
      intervalo: P1D
      retraso-inicial: PT20M
  outbox:
    intervalo-ms: 500
    tamano-lote: 50

management:
  # Trazas: desactivadas salvo TRAZAS_ACTIVAS=true (perfil observabilidad, Jaeger).
  tracing:
    enabled: ${TRAZAS_ACTIVAS:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRAZAS_URL:http://jaeger:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit,almacen
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      servicio: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
