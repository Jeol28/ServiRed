server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: reportes
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PUERTO:5672}
    username: ${RABBITMQ_USUARIO:guest}
    password: ${RABBITMQ_CLAVE:guest}
    template:
      observation-enabled: true
    # Confirmación del broker al reprogramar un reintento.
    publisher-confirm-type: simple
    listener:
      simple:
        prefetch: 10
        # Si la cola aún no existe, el consumidor reintenta sin tumbar el servicio.
        missing-queues-fatal: false
        default-requeue-rejected: false
        observation-enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # El contrato público declara additionalProperties: false.
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # La política de evidencias (5 MB) se valida en el dominio; aquí un tope técnico.
      max-file-size: 5MB
      max-request-size: 6MB

servired:
  persistencia:
    url: ${PERSISTENCIA_URL:http://persistencia:8080}
    # Clave propia de este servicio ante Persistencia (PERSISTENCIA_CLAVE_REPORTES en .env).
    clave: ${PERSISTENCIA_CLAVE:}
    timeout-conexion: 2s
    timeout-lectura: 5s
    intentos: 3
    espera-entre-intentos: 200ms
    # Circuit breaker (ADR-20): abre con >= 50 % de fallas en las últimas 20 llamadas
    # (mínimo 10); abierto falla al instante 15 s y luego prueba con 3 llamadas.
    circuito:
      ventana: 20
      minimo-llamadas: 10
      porcentaje-fallas: 50
      espera-abierto: 15s
      llamadas-de-prueba: 3
  validacion:
    # Validación comunitaria (RF-4, ADR-08)
    umbral: 3
    radio-metros: 1000
  jwt:
    # Revalida el token emitido por Identidad (decisión F).
    jwks-url: ${IDENTIDAD_JWKS_URL:http://identidad:8080/.well-known/jwks.json}
    emisor: servired-identidad
    audiencia: servired-api

management:
  # Trazas: desactivadas salvo TRAZAS_ACTIVAS=true (perfil observabilidad, Jaeger).
  tracing:
    enabled: ${TRAZAS_ACTIVAS:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRAZAS_URL:http://jaeger:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,rabbit
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      servicio: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
